.frame[data-w="desktop"]{--floor:24px}   /* fine pointer: WCAG floor, not the touch floor */

/* ---- page chrome (not the design) ---- */
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;background:#e6e8ec;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.strip{position:sticky;top:0;z-index:50;background:#111827;color:#e5e7eb;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:12px}
.strip .g{display:flex;align-items:center;gap:6px}
.strip .g>b{color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.seg{display:inline-flex;border:1px solid #374151;border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#d1d5db;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:#f3f4f6;color:#111827;font-weight:600}
.stage{padding:20px 24px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.notes{max-width:1180px;width:100%;font-size:13px;color:#374151;line-height:1.5}
.notes b{color:#111}

/* ---- the frame ---- */
.frame{background:var(--bg);color:var(--fg);font-size:var(--fs);line-height:1.35;overflow:clip;position:relative;display:flex;flex-direction:column;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--display:var(--font);--mono:var(--font);
  font-family:var(--font);font-variant-numeric:tabular-nums;border:1px solid #c9ced6}
.frame[data-w="desktop"]{width:1440px;height:860px;border-radius:8px}
.frame[data-w="tablet"]{width:1024px;height:768px;border-radius:12px}
.frame[data-w="phone"]{width:390px;height:844px;border-radius:36px;border:8px solid #111}
.frame *{font-variant-numeric:tabular-nums}
:where(.frame) button,:where(.frame) input{font:inherit;color:inherit;font-family:inherit}
:where(.frame) button{cursor:pointer;background:none;border:0;padding:0}
.frame svg{width:calc(var(--fs) * 1.35);height:calc(var(--fs) * 1.35);flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.frame :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.frame .ring{outline:2px solid var(--ring);outline-offset:2px}
.mut{color:var(--muted-fg)} .sm{font-size:calc(var(--fs)*.93)} .xs{font-size:calc(var(--fs)*.86)} .b{font-weight:600}
.money{white-space:nowrap} .neg{color:var(--bad)} .up{color:var(--ok)} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:calc(var(--u)*2)} .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.press{transition:background-color 80ms var(--ease),transform 80ms var(--ease),border-color 80ms var(--ease)} .press:active{transform:scale(.985)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);height:max(var(--ctl),var(--floor));padding:0 calc(var(--u)*4);border-radius:var(--r);border:var(--hair) solid var(--border);background:var(--card);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:active{background:var(--muted)} .btn.p{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:600} .btn.p:active{filter:brightness(.92)}
.btn.q{background:transparent;border-color:transparent} .btn.q:active{background:var(--muted)} .btn.d{color:var(--destructive)} .btn.xl{height:max(calc(var(--tile) * .875),var(--floor));font-size:calc(var(--fs) * 1.14)} .btn:disabled{opacity:.45;cursor:default}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);color:var(--muted-fg)} .ibtn:active{background:var(--muted)} .ibtn.on{color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:max(calc(var(--ctl) - 8px),var(--floor));padding:0 calc(var(--u)*3);border-radius:999px;border:var(--hair) solid var(--border);background:var(--card);white-space:nowrap} .chip.on{border-color:var(--primary);color:var(--primary);font-weight:600}
.in{height:max(var(--ctl),var(--floor));border:var(--hair) solid var(--border);border-radius:var(--r);background:var(--card);padding:0 calc(var(--u)*3);width:100%;outline:none} .in::placeholder{color:var(--muted-fg)} .in:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.st{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);white-space:nowrap} .st i{width:8px;height:8px;border-radius:50%;background:var(--neutral);flex:none} .st.ok i{background:var(--ok)} .st.warn i{background:var(--warn)} .st.bad i{background:var(--bad)} .st.info i{background:var(--info)}
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:calc(var(--fs)*1.7);padding:0 calc(var(--u)*2.5);border-radius:999px;font-size:calc(var(--fs)*.86);font-weight:600;border:var(--hair) solid var(--border);color:var(--muted-fg);white-space:nowrap} .pill.warn{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 45%,transparent)}
.segt{display:inline-flex;border:var(--hair) solid var(--border);border-radius:var(--r);overflow:hidden;height:max(var(--ctl),var(--floor));background:var(--card)}
.segt button{padding:0 calc(var(--u)*3);color:var(--muted-fg);display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);font-weight:500;min-width:max(var(--ctl),var(--floor))}
.segt button.on{background:var(--muted);color:var(--fg);font-weight:600}
.segt button+button{border-left:var(--hair) solid var(--border)}
.body{flex:1;display:flex;min-height:0}
.rail{width:max(56px,calc(var(--ctl) + var(--u)*3));background:var(--rail);border-right:var(--hair) solid var(--rail-border);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*2) 0;gap:var(--u);flex:none}
.rail .logo{width:calc(var(--ctl) - 8px);height:calc(var(--ctl) - 8px);border-radius:calc(var(--r) - 2px);background:var(--primary);margin-bottom:calc(var(--u)*2)}
.rail .it{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--rail-fg);position:relative} .rail .it.on{background:var(--card);color:var(--primary);border:var(--hair) solid var(--rail-border)} .rail .sp{margin-top:auto}
.main{flex:1;min-width:0;display:flex;position:relative;overflow:hidden}
.screen{flex:1;display:flex;min-width:0} .frame[data-w="phone"] .screen{flex-direction:column}

/* the column divider: 8 px, draggable, grip on hover (web) or always faint (touch) */
.divider{width:8px;flex:none;position:relative;cursor:col-resize;background:var(--bg)}
.divider::after{content:"";position:absolute;left:2px;top:50%;width:4px;height:48px;margin-top:-24px;border-radius:2px;background:var(--border);opacity:.9;transition:background-color var(--t)}
.frame[data-w="desktop"] .divider::after{opacity:0} .frame[data-w="desktop"] .divider:hover::after{opacity:1;background:var(--muted-fg)}
.divider:active::after{background:var(--primary)}

/* ---- products column ---- */
.prodcol{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*3) 0 calc(var(--u)*3) calc(var(--u)*4);flex:none}
.frame[data-w="phone"] .toolbar{padding:calc(var(--u)*2.5) calc(var(--u)*3)}
.search{position:relative;flex:1} .search svg{position:absolute;left:calc(var(--u)*3);top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none} .search .in{padding-left:calc(var(--u)*3 + var(--fs)*1.35 + var(--u)*2)}
.tiles{display:grid;gap:calc(var(--u)*3);padding:0 0 calc(var(--u)*4) calc(var(--u)*4);overflow:auto;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tile) * 2.5),1fr))}
/* the surface the products sit on (Paul 2026-09-17, from board 3): today's page grey · a floating white sheet with a shadow and no stroke · all white with one seam */
.frame[data-surface="float"] .ptable,.frame[data-surface="float"] .tiles{margin:0 0 calc(var(--u)*4) calc(var(--u)*4);border-radius:12px;background:var(--card);box-shadow:0 1px 2px oklch(0.2 0.02 250 / .06),0 6px 16px oklch(0.2 0.02 250 / .07);overflow:hidden}
.frame[data-surface="float"] .ptable{padding:0 calc(var(--u)*2)} .frame[data-surface="float"] .tiles{padding:calc(var(--u)*3)} .frame[data-surface="float"] .tr:hover{background:var(--bg)}
.frame[data-surface="float"][data-w="phone"] .ptable,.frame[data-surface="float"][data-w="phone"] .tiles{margin-right:calc(var(--u)*4)}
.frame[data-surface="allwhite"]{background:var(--card)} .frame[data-surface="allwhite"] .rail{background:var(--card)} .frame[data-surface="allwhite"] .divider{background:var(--card)} .frame[data-surface="allwhite"] .tr:hover{background:var(--bg)} .frame[data-surface="allwhite"] .tile{background:var(--bg)}
/* the filter bar (the app's pills, with their icons; users add their own) */
.fbar{display:flex;align-items:center;gap:calc(var(--u)*1.5);padding:0 0 calc(var(--u)*2.5) calc(var(--u)*4);flex:none;overflow:hidden;mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*1.25);height:max(calc(var(--ctl) - 12px),32px);padding:0 calc(var(--u)*2.5) 0 calc(var(--u)*3);border-radius:999px;border:var(--hair) solid var(--border);background:var(--card);color:var(--fg);white-space:nowrap;font-size:calc(var(--fs)*.93)} .pill svg{width:14px;height:14px;color:var(--muted-fg)} .pill.q{border-style:dashed} .pill.add{padding:0 calc(var(--u)*2.5);color:var(--muted-fg)} .pill:active{background:var(--muted)}
/* the row is the button (Paul 2026-09-17, every tablet POS): a tap anywhere adds; the last column's + becomes the in-cart count */
.tr.rowbtn{cursor:pointer} .tr.rowbtn:active{background:color-mix(in oklch,var(--primary) 10%,transparent)}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 calc(var(--u)*2);border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:calc(var(--fs)*.93);font-weight:700}
/* the footer: icons and values (decided 2026-09-17): % Shop base ▾ · n of m · sync */
.tfoot{display:flex;align-items:center;gap:calc(var(--u)*3);height:max(var(--ctl),var(--floor));border-top:var(--hair) solid var(--border);color:var(--muted-fg);padding:0 var(--u) 0 calc(var(--u)*3);flex:none;font-size:calc(var(--fs)*.9)} .tfoot .tax{display:inline-flex;align-items:center;gap:calc(var(--u)*1);white-space:nowrap;cursor:pointer} .tfoot .tax b{color:var(--fg);font-weight:500} .tfoot .tax svg{width:14px;height:14px} .tfoot .fi{width:22px;height:22px;border-radius:5px;background:var(--muted);display:inline-flex;align-items:center;justify-content:center;margin-right:2px} .tfoot .fi svg{width:13px;height:13px}
/* product table view — the same table components as the orders screen (thead / tr / td), no frame */
.ptable{flex:1;min-height:0;display:flex;flex-direction:column;margin-left:calc(var(--u)*4)}
.thead{display:grid;align-items:center;height:max(calc(var(--row) - 8px),32px);border-bottom:var(--hair) solid var(--border);color:var(--muted-fg);font-size:calc(var(--fs)*.8);font-weight:600;letter-spacing:.05em;text-transform:uppercase;flex:none}
.th{padding:0 calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*1);white-space:nowrap;overflow:hidden;position:relative;height:100%} .th.r{justify-content:flex-end} .th.c{justify-content:center}
.th .rz{position:absolute;right:0;top:25%;height:50%;width:1px;background:var(--border)}
.tbody{flex:1;overflow:auto;min-height:0}
.tr{display:grid;align-items:center;min-height:max(var(--row),var(--floor));border-bottom:var(--hair) solid var(--border)} .tr:hover{background:var(--card)}
.td{padding:calc(var(--u)*1.5) calc(var(--u)*3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .td.r{text-align:right} .td.c{display:flex;justify-content:center}
.td .sub{display:block;color:var(--muted-fg);font-size:calc(var(--fs)*.86)} .td .img{width:40px;height:40px;border-radius:calc(var(--r) - 2px);background:var(--muted)}
.tr.vh{background:transparent} .tr.vh .td:first-child{padding-left:calc(var(--u)*10)}
.frame[data-w="phone"] .tiles{padding:0 calc(var(--u)*3) calc(var(--u)*3);grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border:var(--hair) solid var(--border);border-radius:var(--r);padding:calc(var(--u)*2.5);display:flex;flex-direction:column;gap:calc(var(--u)*1.5);text-align:left;min-height:calc(var(--tile) * 2)} .tile:active{background:var(--muted)}
.tile .img{height:var(--tile);border-radius:calc(var(--r) - 2px);background:var(--muted)} .tile .n{font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .tile .p{color:var(--muted-fg)}
.tile.sk .n,.tile.sk .p{height:calc(var(--fs)*1);border-radius:4px;background:var(--muted);color:transparent} .tile.sk .p{width:40%}
.notice{margin:0 0 calc(var(--u)*3) calc(var(--u)*4);padding:calc(var(--u)*2.5) calc(var(--u)*3);border:var(--hair) solid var(--border);border-radius:var(--r);background:var(--card);display:flex;align-items:center;gap:calc(var(--u)*2)} .notice.warn{border-color:color-mix(in oklch,var(--warn) 45%,transparent);background:var(--warn-bg)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);color:var(--muted-fg);padding:calc(var(--u)*6);text-align:center} .empty svg{width:calc(var(--fs)*2.2);height:calc(var(--fs)*2.2);stroke-width:1.5} .empty .t{color:var(--fg);font-weight:500}
.gate{position:absolute;inset:0;background:color-mix(in oklch,var(--bg) 72%,transparent);display:flex;align-items:center;justify-content:center} .gate>div{background:var(--card);border:var(--hair) solid var(--border);border-radius:var(--r);padding:calc(var(--u)*3) calc(var(--u)*4)}
/* products settings: the slide-out that is live on next, drawn over the products column so the grid stays visible */
/* full-height slide-outs: cart dialogs come in on the products side (left) so the cart stays visible; products
   settings on the opposite side (right). Both are what next does with its side Dialogs; on phone they are sheets. */

  const t=T(); const total=sub(); const entry=S.entry??total; const ghost=S.entry===null; const m=METHODS.find(x=>x.id===S.method)||METHODS[0];

    const change=S.entry&&S.entry>total?S.entry-total:0;

      <div class="acts"><button class="btn xl p press" data-act="newSale">${I.print}${t.printNew}</button><button class="btn press" data-act="newSale">${t.email}</button><button class="btn q press" data-act="newSale">${t.noRcpt}</button></div></div></div>`;
  }
  if (S.view==='legacy'){
    const f=(l,w='100%')=>`<div style="flex:1 1 ${w};min-width:120px"><div class="xs mut" style="margin-bottom:4px">${l}</div><div style="height:38px;border:var(--hair) solid var(--border);border-radius:6px;background:var(--card)"></div></div>`;
    return `<div class="pay">${tenderHead()}<div class="scroll" style="padding:calc(var(--u)*3) calc(var(--u)*4)">
      <div style="border:var(--hair) dashed var(--border);border-radius:var(--r);padding:calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*3);background:var(--bg)">
        <div class="row xs mut"><span class="st info"><i></i>Store checkout · loaded from your site</span><span class="grow"></span><span>iframe</span></div>
        <div class="b">Billing details</div>
        <div class="row" style="gap:calc(var(--u)*3);flex-wrap:wrap">${f('First name','40%')}${f('Last name','40%')}</div>
        ${f('Email address')}
        <div class="b" style="margin-top:calc(var(--u)*2)">Payment</div>
        <div class="list"><div class="lr"><span class="radio on"></span>Credit card (Stripe)</div><div class="lr" style="flex-direction:column;align-items:stretch;gap:calc(var(--u)*2);padding:calc(var(--u)*3)"><div class="row" style="gap:calc(var(--u)*3)">${f('Card number','60%')}${f('Expiry','15%')}${f('CVC','15%')}</div></div><div class="lr"><span class="radio"></span>PayPal</div><div class="lr"><span class="radio"></span>Bank transfer</div></div>
      </div></div>
      <div class="commit" style="flex-direction:row"><button class="btn xl press" data-act="closeTender" style="width:auto">Return to cart</button><button class="btn xl p press" data-act="take" style="width:auto;flex:1">Process payment · ${fmt(total)}</button></div></div>`;
  }
  if (S.view==='terminal'){
    const steps=['Sent','On terminal','Approved','Captured']; const st=S.termStep;
    const status=['Starting the terminal…','Waiting for the customer on the terminal','Approved · capturing…','Captured'][st]||'';
    return `<div class="pay">${tenderHead()}<div class="term">
      <div><div class="lbl">On the terminal</div><div class="big money">${fmt(total)}</div><div class="status" key="${st}">${status}</div></div>
      <div class="ringspin" aria-hidden="true"></div>
      <div class="tcard"><div class="t"><span>SumUp Solo · Counter 1</span><span class="st ok"><i></i>connected · 82%</span></div>
        <div class="steps">${steps.map((s,i)=>`<div class="s ${i<st?'done':i===st?'now':''}"><i></i>${s}</div>`).join('')}</div></div>
      <button class="btn press" data-act="closeTender">Cancel on terminal</button></div></div>`;
  }
  const change=m.change&&entry>total?entry-total:0; const short=entry<total?total-entry:0;
  let line=''; if(change>0) line=`<span class="chg">${t.change} ${fmt(change)}</span>`; else if(short>0) line=`Part payment · ${fmt(short)} left after this`;
  const helpers=m.change?[50,100].map(n=>`<button class="chip press ${entry===n?'on':''}" data-act="entry" data-v="${n}">${fmt(n)}</button>`).join('')+`<button class="chip press ${ghost?'on':''}" data-act="entry" data-v="">${t.exactAmt} ${fmt(total)}</button>`:`<button class="chip press ${ghost?'on':''}" data-act="entry" data-v="">Full balance ${fmt(total)}</button>`;
  const commit=m.k==='terminal'?`Send ${fmt(Math.min(entry,total))} to ${m.t}`:m.k==='globe'?`Pay ${fmt(total)} with ${m.t}`:`${t.take} ${fmt(Math.min(entry,total))} ${t.in} ${m.t}`;
  const tile=x=>`<button class="mt press ${x.id===S.method?'on':''} ${x.k==='globe'?'legacy':''}" data-act="method" data-m="${x.id}">${I[x.k]}<span class="ell">${x.t}</span>${x.dot?`<span class="dot"></span>`:''}</button>`;
  /* the legacy switch: a tile in the grid goes to the iframe view like a terminal tile goes to the terminal view */
  const legacyTile = S.legacy==='tile' ? `<button class="mt press legacy" data-act="mode" data-mode="legacy" title="The store's own checkout page">${I.globe}<span class="ell">${t.legacy}</span></button>` : '';
  let methods=`<div class="methods">${METHODS.map(tile).join('')}${legacyTile}</div>`;
  const unav=`<div class="unav xs">${UNAVAIL.length} ${t.notAvail} · ${UNAVAIL.map(([n,w])=>`${n} (${w})`).join(', ')}</div>`;
  const bottomClose = (S.closePos==='bottom' ? `<button class="btn q press" data-act="closeTender">${I.back}${t.backCart}</button>` : '') + (S.legacy==='bottom' ? `<button class="btn q press" data-act="mode" data-mode="legacy" style="color:var(--muted-fg)">${I.globe}${t.legacyLink}</button>` : '');
  return `<div class="pay">${tenderHead()}<div class="scroll">
    <div class="amtblock"><div class="lbl">${t.toPay} <span class="money">${fmt(total)}</span><button class="chip press" style="text-transform:none;letter-spacing:0;height:calc(var(--fs)*1.9)">${t.split}</button>${!S.online?`<span class="pill warn">${I.cloudoff}${t.offline}</span>`:''}</div><div class="big money ${ghost?'ghost':''}">${fmt(entry)}</div><div class="line">${line}</div></div>
    ${methods}${unav}</div><div class="helpers">${helpers}</div>
    <div class="keys">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button class="k press" data-act="key" data-k="${k}">${k}</button>`).join('')}<button class="k sub press" data-act="key" data-k="C">C</button><button class="k press" data-act="key" data-k="0">0</button><button class="k sub press" data-act="key" data-k="⌫">${I.del}</button></div>
    <div class="commit"><button class="btn xl p press" data-act="take">${commit}</button>${bottomClose}</div></div>`;
}
function renderLedger(){
  const t=T(); const items=lines(); const s=sub(); const paid=S.view==='paid'?s:0;
  const payRow=S.view==='paid'?`<div class="line payrow"><div class="lb" style="grid-template-columns:1fr auto"><span class="n">${S.method==='cash'?'Cash':'SumUp'}<span class="sub">${S.method==='cash'?'Tendered':'Contactless'} · <span class="st ok"><i></i>Captured</span></span></span><span class="money b">${fmt(s)}</span></div></div>`
    :S.view==='terminal'?`<div class="line payrow"><div class="lb" style="grid-template-columns:1fr auto"><span class="n">SumUp<span class="sub"><span class="st warn"><i></i>Waiting on the terminal</span></span></span><span class="money">${fmt(s)}</span></div></div>`:`<div class="mut" style="padding:0 calc(var(--u)*4) calc(var(--u)*3)">No payments yet</div>`;
  return `<div class="cartcol ledger">${renderBar()}<div class="custrow"><span class="b">#102476</span><span class="mut">${t.guest}</span></div>
    <div class="lines">${items.map(([n,q,p,,k])=>`<div class="line ${k}"><div class="lb"><span class="q">${q}</span><span class="n ell">${n}</span><span class="pr money">${fmt(p)}</span><span class="tot money" style="font-weight:400">${fmt(q*p)}</span></div></div>`).join('')}<div class="pl">${t.payments}</div>${payRow}</div>
    <div class="totals"><div class="r2 mut"><span>${t.total}</span><span class="money">${fmt(s)}</span></div><div class="r2 mut"><span>${t.paid}</span><span class="money">${fmt(paid)}</span></div><div class="r2 big"><span>${paid>=s?t.paid:'Remaining'}</span><span class="money">${fmt(s-paid)}</span></div></div>${renderTabs('bottom')}</div>`;
}
function renderPOS(){
  const t=T(); const phone=S.w==='phone';
  if (S.tender){ if (phone) return `<div class="screen">${renderTender()}</div>`; return `<div class="screen">${renderTender()}<div class="divider" title="Drag to resize"></div>${renderLedger()}</div>`; }
  if (!phone) return `<div class="screen">${renderProducts()}<div class="divider" title="Drag to resize"></div>${renderCartColumn()}</div>`;
  const n=lines().length; const badge=n?`<span class="badge">${n}</span>`:'';
  return `<div class="screen">${S.phoneTab==='products'?renderProducts():renderCartColumn()}<div class="tabbar"><button class="press ${S.phoneTab==='products'?'on':''}" data-set="phoneTab" data-v="products">${I.products}${t.products}</button><button class="press ${S.phoneTab==='cart'?'on':''}" data-set="phoneTab" data-v="cart">${badge}${I.cart}${sessionOpen()?t.cart:t.register}</button></div></div>`;
}
function renderNotes(){
  const rows=[['Scale step',S.scale,{compact:'unit 3.5 · base 13 · control 40 (44 on touch) · row 36 (44 on touch) · tile 56 · radius 6',regular:'unit 4 · base 14 · control 44 · row 44 · tile 64 · radius 8',spacious:'unit 5 · base 16 · control 52 · row 52 · tile 80 · radius 10'}[S.scale]],
    ['Pointer',S.w==='desktop'?'fine (mouse)':'coarse (touch)',S.w==='desktop'?'hover the total for the nudge, click it to open; the divider grip on hover':'line actions by swiping the total; the divider grip always faint'],
    ['Focus','',{open:'search field, on open; the scanner is captured anywhere',added:'the quantity of the line just added; Enter checks out','line-edit':'the name field; Tab moves to price, Enter saves, Esc cancels',tender:'the amount; digits type, Enter takes the selected method, Esc closes',closed:'the float amount; Enter opens the register',counting:'the counted amount; Enter closes and prints'}[S.scn]||'—']];
  document.getElementById('notes').innerHTML=`<b>Prototype for wcpos/roadmap#287 (cut 2).</b> The dark strip is not part of the design. `+rows.map(([k,v,d])=>`<span style="display:inline-block;margin-right:16px"><b>${k}:</b> ${v} <span style="color:#6b7280">${d}</span></span>`).join('');
}
/* the total settles: one 220 ms nudge when a line lands (Paul: the count-up would get boring). No numbers spin. */
function rollMoney(from,to){
  if(from===to) return; const els=[...document.querySelectorAll('.cartcol .totals .big .money, .cartcol .btn.p .money')];
  els.forEach(e=>{ e.classList.remove('settled'); void e.offsetWidth; e.classList.add('settled'); setTimeout(()=>e.classList.remove('settled'),300); });
}
function render(){
  Object.assign(I, I0, S.icons==='lucide'?{}:(ICONSETS[S.icons]||{}));
  renderStrip();
  const f=document.getElementById('frame'); f.className='frame'; f.dataset.w=S.w; f.dataset.theme=S.theme; f.dataset.scale=S.scale; f.dataset.surface=S.surface;
  f.innerHTML=`<div class="body">${S.w==='phone'?'':renderRail()}<div class="main">${renderPOS()}${renderSide()}${renderPanel()}${renderSheet()}</div></div>`;
  renderNotes();
  const x=f.querySelector('.qx'); if(x){ const q=f.querySelector(`.line[data-i="${S.qx}"] .q`); const col=f.querySelector('.cartcol'); if(q&&col){ const a=q.getBoundingClientRect(), c=col.getBoundingClientRect(); const dy=(48-a.height)/2; x.style.left=(a.left-c.left-48-(48-a.width)/2)+'px'; x.style.top=(a.top-c.top-dy)+'px'; x.style.setProperty('--qdy',dy+'px'); } else { S.qx=null; x.remove(); } }
}
function stepTerminal(){ clearTimeout(termTimer); if(S.view!=='terminal') return; if(S.termStep<3){ termTimer=setTimeout(()=>{ S.termStep++; render(); stepTerminal(); }, S.termStep===1?2600:900); } else termTimer=setTimeout(()=>{ S.view='paid'; render(); },500); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-set],[data-scn],[data-act],[data-tx],[data-txall]');
  if(S.dragged){ S.dragged=false; return; }   /* the click that follows a swipe must not close what the swipe opened */
  if(!b){ if(!e.target.closest('[data-stop]') && (S.pop||S.ordlist||S.reveal!=null||S.edit!=null||S.qx!=null)){ S.pop=null; S.ordlist=false; S.reveal=null; S.edit=null; S.qx=null; S.qbuf=''; render(); } return; }
  if(b.dataset.set){ const v=b.dataset.v; S[b.dataset.set]=(v==='1'||v==='3')?+v:v; render(); return; }
  if(b.dataset.tx){ S.tx[b.dataset.tx]=S.tx[b.dataset.tx]?0:1; render(); return; }
  if(b.dataset.txall!==undefined){ const v=+b.dataset.txall; Object.keys(S.tx).forEach(k=>S.tx[k]=v); render(); return; }
  if(b.dataset.scn && !b.dataset.act){ jump(b.dataset.scn); return; }
  const a=b.dataset.act;
  switch(a){
    case 'noop': break;
    case 'jumpTo': jump(b.dataset.scn); return;
    case 'addLine': { if(!sessionOpen()) break; const before=sub(); if(b.dataset.n){ if(S.scn==='empty') S.scn='open'; const arr=lines(); const v=b.dataset.s||''; const ex=arr.find(l=>l[0]===b.dataset.n&&(l[3]||'')===v); if(ex){ ex[1]++; S.settleIdx=arr.indexOf(ex); } else { arr.unshift([b.dataset.n,1,+b.dataset.p,v,'p']); S.settleIdx=0; } } else S.settleIdx=0; S.scn='added'; S.settle='line'; S.phoneTab='cart'; render(); if(S.tx.roll) rollMoney(before, sub()); setTimeout(()=>{ if(S.settle==='line'){ S.settle=null; document.querySelectorAll('.line.settle').forEach(n=>n.classList.remove('settle')); } },900); return; }
    case 'editLine': S.edit=+b.dataset.i; S.reveal=null; break;
    case 'removeLine': { const i=+b.dataset.i; const arr=lines(); if(!arr[i]) break; const [l]=arr.splice(i,1); S.reveal=null; S.qx=null; S.qbuf=''; S.undoLine={l,at:i,arr}; clearTimeout(S.undoT); S.undoT=setTimeout(()=>{ S.undoLine=null; render(); },3000); break; }
    case 'undoLine': if(S.undoLine){ S.undoLine.arr.splice(S.undoLine.at,0,S.undoLine.l); S.undoLine=null; clearTimeout(S.undoT); } break;
    case 'qopen': { const i=+b.dataset.i; S.qbuf=''; S.reveal=null; S.edit=null; if(S.qx===i){ S.qx=null; S.sheet=S.sheet==='qty'?null:S.sheet; } else { S.qx=i; if(S.w==='phone') S.sheet='qty'; } break; }
    case 'qclose': S.qx=null; S.qbuf=''; if(S.sheet==='qty') S.sheet=null; break;
    case 'qinc': { const l=lines()[+b.dataset.i]; if(l){ l[1]++; S.qbuf=''; } break; }
    case 'qdec': { const i=+b.dataset.i; const l=lines()[i]; if(!l) break; S.qbuf=''; if(l[1]<=1){ const arr=lines(); const [g]=arr.splice(i,1); S.qx=null; if(S.sheet==='qty') S.sheet=null; S.undoLine={l:g,at:i,arr}; clearTimeout(S.undoT); S.undoT=setTimeout(()=>{ S.undoLine=null; render(); },3000); } else l[1]--; break; }
    case 'qkey': { const i=+b.dataset.i; const l=lines()[i]; if(!l) break; const k=b.dataset.k; S.qbuf = k==='bs' ? S.qbuf.slice(0,-1) : (S.qbuf+k).replace(/^0+(?=\d)/,'').slice(0,3); const n=parseInt(S.qbuf||'0',10); if(n>0) l[1]=n; break; }
    case 'vmenu': S.vmenu=!S.vmenu; break;
    case 'void': S.vmenu=false; S.pop=null; S.scn='empty'; S.toast='voided'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{S.toast=null;render();},4000); break;
    case 'undoVoid': S.toast=null; clearTimeout(toastTimer); S.scn='open'; break;
    case 'selOrder': S.ordlist=false; break;
    case 'ordlist': S.ordlist=!S.ordlist; break;
    case 'sortCart': S.sortCart=b.dataset.v; break;
    case 'openPanel': S.panel=true; break;
    case 'closePanel': if(e.target.closest('[data-stop]') && !b.classList.contains('ibtn')) return; S.panel=false; break;
    case 'openSheet': S.sheet=b.dataset.sheet; S.reveal=null; break;
    case 'closeSheet': if(e.target.closest('[data-stop]') && !b.classList.contains('ibtn') && !b.classList.contains('btn')) return; S.sheet=null; if(S.scn==='closure') S.scn='closed'; break;
    case 'startCount': S.panel=false; S.scn='counting'; S.counted=''; break;
    case 'doOpen': S.scn='open'; break;
    case 'togglePop': if(b.classList.contains('sidewrap') && e.target.closest('[data-stop]')) return; S.pop=S.pop===b.dataset.pop?null:b.dataset.pop; break;
    case 'toggleView': S.view2=S.view2==='grid'?'list':'grid'; break;
    case 'checkout': S.tender=true; S.view='keypad'; S.entry=null; S.method='cash'; break;
    case 'closeTender': clearTimeout(termTimer); S.tender=false; S.view='keypad'; break;
    case 'method': S.method=b.dataset.m; S.entry=null; break;
    case 'mode': S.view = b.dataset.mode==='legacy' ? 'legacy' : 'keypad'; break;
    case 'entry': S.entry=b.dataset.v===''?null:+b.dataset.v; break;
    case 'key': { const k=b.dataset.k; const cur=S.entry===null?'':String(Math.round(S.entry*100)); const d=k==='C'?'':k==='⌫'?cur.slice(0,-1):(cur+k).slice(0,8); S.entry=d===''?null:+d/100; break; }
    case 'take': { const m=[...METHODS,...LEGACY].find(x=>x.id===S.method); if(m&&m.k==='terminal'){ S.view='terminal'; S.termStep=0; render(); termTimer=setTimeout(()=>{S.termStep=1;render();stepTerminal();},700); return; } S.view='paid'; break; }
    case 'newSale': {
      const done=()=>{ S.tender=false; S.view='keypad'; S.entry=null; S.scn='empty'; render(); const c=document.querySelector('.cartcol'); if(c&&S.tx.tear&&WHIMSY.includes(S.theme)){ c.classList.add('rollin'); setTimeout(()=>c.classList.remove('rollin'),500); } };
      const led=document.querySelector('.cartcol.ledger');
      if(S.tx.tear&&WHIMSY.includes(S.theme)&&led){ led.classList.add('tearing'); setTimeout(done,420); return; }
      done(); return; }
  }
  render();
});
document.addEventListener('input',e=>{ if(e.target.dataset.count){ S.counted=e.target.value; const pos=e.target.selectionStart; render(); const n=document.querySelector('[data-count]'); if(n){n.focus(); n.setSelectionRange(pos,pos);} } });
document.addEventListener('pointerdown',e=>{
  const tot=e.target.closest('.line .tot[data-tot]'); if(!tot||S.edit!=null) return; const ln=tot.closest('.line'); const lb=ln.querySelector('.lb'); const i=+ln.dataset.i;
  const x0=e.clientX; let dx=0, moved=false; const open=S.reveal===i; const w=ln.querySelector('.acts').getBoundingClientRect().width||160;
  ln.classList.add('drag'); ln.setPointerCapture(e.pointerId);
  const move=ev=>{ dx=Math.min(0,Math.max(-(w+140),ev.clientX-x0-(open?w:0))); if(Math.abs(ev.clientX-x0)>3) moved=true; lb.style.transform=`translateX(${dx}px)`; };
  const up=()=>{ ln.removeEventListener('pointermove',move); ln.removeEventListener('pointerup',up); ln.removeEventListener('pointercancel',up); ln.classList.remove('drag'); lb.style.transform='';
    if(moved){ S.dragged=true; setTimeout(()=>{ S.dragged=false; },250); }
    if(!moved){ if(S.w==='desktop'){ S.reveal = open?null:i; S.dragged=true; setTimeout(()=>{ S.dragged=false; },250); render(); } return; }
    if(dx < -(w+80)){ ln.classList.add('going'); setTimeout(()=>{ document.querySelector(`.line[data-i="${i}"] .acts .del`)?.click(); },170); }
    else if(dx < -(w/2)){ S.reveal=i; render(); } else { S.reveal=null; render(); } };
  ln.addEventListener('pointermove',move); ln.addEventListener('pointerup',up); ln.addEventListener('pointercancel',up);
});
document.addEventListener('keydown',e=>{
  if (S.qx!=null && S.w!=='phone'){ if(/^[0-9]$/.test(e.key)) { document.querySelector(`.qx [data-act="qkey"][data-k="${e.key}"]`)?.click(); return; } if(e.key==='Backspace'){ document.querySelector('.qx [data-act="qkey"][data-k="bs"]')?.click(); return; } if(e.key==='Enter'||e.key==='Escape'){ S.qx=null; S.qbuf=''; render(); return; } }
  if (S.edit!=null && (e.key==='Enter'||e.key==='Escape')){ S.edit=null; render(); return; }
  if (!S.tender || S.view!=='keypad') return;
  if (/^[0-9]$/.test(e.key)) document.querySelector(`[data-act="key"][data-k="${e.key}"]`)?.click();
  else if (e.key==='Backspace') document.querySelector('[data-act="key"][data-k="⌫"]')?.click();
  else if (e.key==='Enter') document.querySelector('[data-act="take"]')?.click();
  else if (e.key==='Escape') document.querySelector('[data-act="closeTender"]')?.click();
});
