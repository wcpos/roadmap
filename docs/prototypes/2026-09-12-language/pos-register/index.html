<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POS register — the 1.11.0 language (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* =====================================================================
   TOKENS — the part of this file that is the design.
   Three axes: colour theme (data-theme), scale step (data-scale), width
   class (data-w). Everything below the tokens reads only tokens.
   ===================================================================== */
.frame{
  /* scale step: regular */
  --u:4px;            /* spacing unit; Tailwind's --spacing */
  --fs:14px;          /* base font (web) */
  --ctl:44px;         /* form control height (Input, Button, Select) */
  --row:44px;         /* list and table row */
  --tile:64px;        /* product tile image, tender tile, keypad key */
  --r:8px;            /* the one radius */
  --amt:40px;         /* leading amount */
  --hair:1px;
  --floor:44px;       /* touch floor: no control or row under this on a coarse pointer */
  --ease:cubic-bezier(.2,.7,.2,1);
  --t:180ms;
}
.frame[data-scale="compact"]{--u:3.5px;--fs:13px;--ctl:40px;--row:36px;--tile:56px;--r:6px;--amt:34px}
.frame[data-scale="spacious"]{--u:5px;--fs:16px;--ctl:52px;--row:52px;--tile:80px;--r:10px;--amt:48px}
.frame[data-w="desktop"]{--floor:24px}   /* fine pointer: WCAG floor, not the touch floor */

/* colour: the working surface is neutral in every theme; the theme reaches the
   controls (primary, ring, selected) and the rail. Status colours are fixed. */
.frame{
  --bg:oklch(0.975 0.004 250);--fg:oklch(0.22 0.02 250);--card:oklch(1 0 0);
  --muted:oklch(0.955 0.006 250);--muted-fg:oklch(0.50 0.02 250);--border:oklch(0.90 0.008 250);
  --primary:oklch(0.50 0.18 240);--primary-fg:oklch(0.99 0.01 240);--ring:oklch(0.50 0.18 240);
  --rail:oklch(0.955 0.014 250);--rail-fg:oklch(0.40 0.03 250);--rail-border:oklch(0.90 0.012 250);
  --destructive:oklch(0.55 0.22 25);--destructive-fg:oklch(0.99 0.01 25);
  --scrim:oklch(0.2 0.02 250 / .28);
  /* fixed semantic set — identical in all five themes */
  --ok:oklch(0.55 0.16 155);--ok-bg:oklch(0.96 0.03 155);
  --warn:oklch(0.68 0.16 70);--warn-bg:oklch(0.97 0.04 85);
  --bad:oklch(0.58 0.2 25);--bad-bg:oklch(0.97 0.02 25);
  --info:oklch(0.58 0.14 240);
  --neutral:oklch(0.62 0.01 250);
  color-scheme:light;
}
.frame[data-theme="dark"]{
  --bg:oklch(0.19 0.018 250);--fg:oklch(0.93 0.01 250);--card:oklch(0.23 0.018 250);
  --muted:oklch(0.28 0.018 250);--muted-fg:oklch(0.70 0.015 250);--border:oklch(0.33 0.02 250);
  --primary:oklch(0.70 0.17 240);--primary-fg:oklch(0.16 0.02 250);--ring:oklch(0.70 0.17 240);
  --rail:oklch(0.16 0.025 250);--rail-fg:oklch(0.72 0.02 250);--rail-border:oklch(0.25 0.02 250);
  --destructive:oklch(0.62 0.2 25);--destructive-fg:oklch(0.99 0.01 25);
  --scrim:oklch(0.05 0.02 250 / .5);
  --ok:oklch(0.72 0.15 155);--ok-bg:oklch(0.28 0.04 155);
  --warn:oklch(0.78 0.15 75);--warn-bg:oklch(0.30 0.05 80);
  --bad:oklch(0.68 0.18 25);--bad-bg:oklch(0.30 0.05 25);
  --info:oklch(0.70 0.13 240);--neutral:oklch(0.62 0.01 250);
  color-scheme:dark;
}
.frame[data-theme="ocean"]{
  --bg:oklch(0.19 0.03 230);--fg:oklch(0.94 0.015 200);--card:oklch(0.23 0.03 228);
  --muted:oklch(0.29 0.03 226);--muted-fg:oklch(0.70 0.03 210);--border:oklch(0.34 0.035 225);
  --primary:oklch(0.72 0.15 195);--primary-fg:oklch(0.16 0.04 200);--ring:oklch(0.72 0.15 195);
  --rail:oklch(0.14 0.045 235);--rail-fg:oklch(0.75 0.04 200);--rail-border:oklch(0.24 0.04 230);
  --destructive:oklch(0.62 0.2 25);--destructive-fg:oklch(0.99 0.01 25);--scrim:oklch(0.05 0.03 230 / .5);
  --ok:oklch(0.72 0.15 155);--ok-bg:oklch(0.28 0.04 155);--warn:oklch(0.78 0.15 75);--warn-bg:oklch(0.30 0.05 80);
  --bad:oklch(0.68 0.18 25);--bad-bg:oklch(0.30 0.05 25);--info:oklch(0.70 0.13 240);--neutral:oklch(0.62 0.01 250);
  color-scheme:dark;
}
.frame[data-theme="sunset"]{
  --bg:oklch(0.20 0.035 318);--fg:oklch(0.95 0.02 50);--card:oklch(0.245 0.04 318);
  --muted:oklch(0.30 0.04 318);--muted-fg:oklch(0.70 0.04 340);--border:oklch(0.35 0.045 322);
  --primary:oklch(0.72 0.18 45);--primary-fg:oklch(0.18 0.05 318);--ring:oklch(0.72 0.18 45);
  --rail:oklch(0.15 0.05 320);--rail-fg:oklch(0.78 0.05 40);--rail-border:oklch(0.25 0.05 318);
  --destructive:oklch(0.62 0.2 20);--destructive-fg:oklch(0.99 0.01 25);--scrim:oklch(0.05 0.03 318 / .5);
  --ok:oklch(0.72 0.15 155);--ok-bg:oklch(0.28 0.04 155);--warn:oklch(0.78 0.15 75);--warn-bg:oklch(0.30 0.05 80);
  --bad:oklch(0.68 0.18 25);--bad-bg:oklch(0.30 0.05 25);--info:oklch(0.70 0.13 240);--neutral:oklch(0.62 0.01 250);
  color-scheme:dark;
}
.frame[data-theme="monochrome"]{
  --bg:oklch(0.15 0 0);--fg:oklch(0.95 0 0);--card:oklch(0.21 0 0);
  --muted:oklch(0.28 0 0);--muted-fg:oklch(0.70 0 0);--border:oklch(0.36 0 0);
  --primary:oklch(0.92 0 0);--primary-fg:oklch(0.12 0 0);--ring:oklch(0.92 0 0);
  --rail:oklch(0.08 0 0);--rail-fg:oklch(0.78 0 0);--rail-border:oklch(0.22 0 0);
  --destructive:oklch(0.62 0.2 25);--destructive-fg:oklch(0.99 0.01 25);--scrim:oklch(0 0 0 / .55);
  --ok:oklch(0.72 0.15 155);--ok-bg:oklch(0.28 0.04 155);--warn:oklch(0.78 0.15 75);--warn-bg:oklch(0.30 0.05 80);
  --bad:oklch(0.68 0.18 25);--bad-bg:oklch(0.30 0.05 25);--info:oklch(0.70 0.13 240);--neutral:oklch(0.62 0.01 250);
  color-scheme:dark;
}

/* =====================================================================
   PAGE CHROME — the dark strip and the stage are not part of the design.
   ===================================================================== */
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;background:#e6e8ec;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.strip{position:sticky;top:0;z-index:50;background:#111827;color:#e5e7eb;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:12px}
.strip .g{display:flex;align-items:center;gap:6px}
.strip .g>b{color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.seg{display:inline-flex;border:1px solid #374151;border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#d1d5db;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:#f3f4f6;color:#111827;font-weight:600}
.stage{padding:20px 24px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.notes{max-width:1180px;width:100%;font-size:13px;color:#374151;line-height:1.5}
.notes b{color:#111}

/* =====================================================================
   THE FRAME — everything inside reads tokens only.
   ===================================================================== */
.frame{background:var(--bg);color:var(--fg);font-size:var(--fs);line-height:1.35;overflow:hidden;position:relative;display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums;border:1px solid #c9ced6}
.frame[data-w="desktop"]{width:1440px;height:860px;border-radius:8px}
.frame[data-w="tablet"]{width:1024px;height:768px;border-radius:12px}
.frame[data-w="phone"]{width:390px;height:844px;border-radius:36px;border:8px solid #111}
.frame *{font-variant-numeric:tabular-nums}
:where(.frame) button,:where(.frame) input{font:inherit;color:inherit;font-family:inherit}
:where(.frame) button{cursor:pointer;background:none;border:0;padding:0}   /* zero-specificity reset so .btn/.tile/.k win */
.frame svg{width:calc(var(--fs) * 1.35);height:calc(var(--fs) * 1.35);flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.frame :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.frame .ring{outline:2px solid var(--ring);outline-offset:2px}       /* the drawn focus story */
.mut{color:var(--muted-fg)}
.sm{font-size:calc(var(--fs) * .93)}
.xs{font-size:calc(var(--fs) * .86)}
.b{font-weight:600}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)} .up{color:var(--ok)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:calc(var(--u)*2)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pressed state within 100 ms, everywhere */
.press{transition:background-color 80ms var(--ease),transform 80ms var(--ease),border-color 80ms var(--ease)}
.press:active{transform:scale(.985)}

/* ---- buttons: one shape, three tones, sized by --ctl with the touch floor ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);height:max(var(--ctl),var(--floor));padding:0 calc(var(--u)*4);border-radius:var(--r);
  border:var(--hair) solid var(--border);background:var(--card);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:active{background:var(--muted)}
.btn.p{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:600}
.btn.p:active{filter:brightness(.92)}
.btn.q{background:transparent;border-color:transparent}
.btn.q:active{background:var(--muted)}
.btn.d{color:var(--destructive);border-color:var(--border)}
.btn.xl{height:max(calc(var(--tile) * .875),var(--floor));font-size:calc(var(--fs) * 1.14)}
.btn:disabled{opacity:.45;cursor:default}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);color:var(--muted-fg)}
.ibtn:active{background:var(--muted)}
.ibtn.on{color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:max(calc(var(--ctl) - 8px),var(--floor));padding:0 calc(var(--u)*3);border-radius:999px;border:var(--hair) solid var(--border);background:var(--card);white-space:nowrap}
.chip.on{border-color:var(--primary);color:var(--primary);font-weight:600}
.in{height:max(var(--ctl),var(--floor));border:var(--hair) solid var(--border);border-radius:var(--r);background:var(--card);padding:0 calc(var(--u)*3);width:100%;outline:none}
.in::placeholder{color:var(--muted-fg)}
.in:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}   /* the field is a control; ring inside the border, no glow */

/* ---- status: a dot plus a word, never a filled pill ---- */
.st{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--neutral);flex:none}
.st.ok i{background:var(--ok)} .st.warn i{background:var(--warn)} .st.bad i{background:var(--bad)} .st.info i{background:var(--info)}
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:calc(var(--fs)*1.7);padding:0 calc(var(--u)*2.5);border-radius:999px;font-size:calc(var(--fs)*.86);font-weight:600;border:var(--hair) solid var(--border);color:var(--muted-fg);white-space:nowrap}
.pill.warn{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in oklch,var(--bad) 45%,transparent)}

/* ---- the app shell ---- */
.body{flex:1;display:flex;min-height:0}
.rail{width:max(56px,calc(var(--ctl) + var(--u)*3));background:var(--rail);border-right:var(--hair) solid var(--rail-border);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*2) 0;gap:calc(var(--u)*1);flex:none}
.rail .logo{width:calc(var(--ctl) - 8px);height:calc(var(--ctl) - 8px);border-radius:calc(var(--r) - 2px);background:var(--primary);margin-bottom:calc(var(--u)*2)}
.rail .it{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--rail-fg);position:relative}
.rail .it:active{background:color-mix(in oklch,var(--rail-fg) 12%,transparent)}
.rail .it.on{background:var(--card);color:var(--primary);border:var(--hair) solid var(--rail-border)}
.rail .sp{margin-top:auto}
.rail .cnt{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.rail .av{width:calc(var(--ctl) - 14px);height:calc(var(--ctl) - 14px);border-radius:50%;background:var(--muted);color:var(--fg);font-size:calc(var(--fs)*.8);font-weight:700;display:flex;align-items:center;justify-content:center}
.main{flex:1;min-width:0;display:flex;position:relative;overflow:hidden}
.screen{flex:1;display:flex;min-width:0}
.frame[data-w="phone"] .screen{flex-direction:column}
.segc{display:inline-flex;border:var(--hair) solid var(--border);border-radius:var(--r);overflow:hidden;height:max(calc(var(--ctl) - 8px),36px)}
.segc button{padding:0 calc(var(--u)*3);color:var(--muted-fg);font-weight:500}
.segc button.on{background:var(--muted);color:var(--fg);font-weight:600}

/* ---- products column ---- */
.prodcol{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*4);flex:none}
.frame[data-w="phone"] .toolbar{padding:calc(var(--u)*2.5) calc(var(--u)*3)}
.search{position:relative;flex:1}
.search svg{position:absolute;left:calc(var(--u)*3);top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none}
.search .in{padding-left:calc(var(--u)*3 + var(--fs)*1.35 + var(--u)*2)}
.tiles{display:grid;gap:calc(var(--u)*3);padding:0 calc(var(--u)*4) calc(var(--u)*4);overflow:auto;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tile) * 2.5),1fr))}
.frame[data-w="phone"] .tiles{padding:0 calc(var(--u)*3) calc(var(--u)*3);grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border:var(--hair) solid var(--border);border-radius:var(--r);padding:calc(var(--u)*2.5);display:flex;flex-direction:column;gap:calc(var(--u)*1.5);text-align:left;min-height:calc(var(--tile) * 2)}
.tile:active{background:var(--muted)}
.tile .img{height:var(--tile);border-radius:calc(var(--r) - 2px);background:var(--muted)}
.tile .n{font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .p{color:var(--muted-fg)}
.tile.sk .n,.tile.sk .p{height:calc(var(--fs)*1);border-radius:4px;background:var(--muted);color:transparent}
.tile.sk .p{width:40%}
.notice{margin:0 calc(var(--u)*4) calc(var(--u)*3);padding:calc(var(--u)*2.5) calc(var(--u)*3);border:var(--hair) solid var(--border);border-radius:var(--r);background:var(--card);display:flex;align-items:center;gap:calc(var(--u)*2)}
.notice.warn{border-color:color-mix(in oklch,var(--warn) 45%,transparent);background:var(--warn-bg)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);color:var(--muted-fg);padding:calc(var(--u)*6)}
.empty svg{width:calc(var(--fs)*2.2);height:calc(var(--fs)*2.2);stroke-width:1.5}
.empty .t{color:var(--fg);font-weight:500}
.gate{position:absolute;inset:0;background:color-mix(in oklch,var(--bg) 72%,transparent);display:flex;align-items:center;justify-content:center}
.gate>div{background:var(--card);border:var(--hair) solid var(--border);border-radius:var(--r);padding:calc(var(--u)*3) calc(var(--u)*4)}

/* ---- cart column ---- */
.cartcol{width:min(42%,440px);min-width:340px;border-left:var(--hair) solid var(--border);background:var(--card);display:flex;flex-direction:column;position:relative}
.frame[data-w="desktop"] .cartcol{width:460px}
.frame[data-w="phone"] .cartcol{width:100%;min-width:0;border-left:0;flex:1;min-height:0}
.bar{height:max(var(--ctl),var(--floor));display:flex;align-items:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*2) 0 calc(var(--u)*4);border-bottom:var(--hair) solid var(--border);flex:none}
.bar .place{font-weight:600;display:inline-flex;align-items:center;gap:calc(var(--u)*2)}
.bar .avbtn{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r)}
.bar .avbtn:active{background:var(--muted)}
.av{width:calc(var(--ctl) - 14px);height:calc(var(--ctl) - 14px);border-radius:50%;background:var(--muted);color:var(--fg);font-size:calc(var(--fs)*.8);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.custrow{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*4);border-bottom:var(--hair) solid var(--border);flex:none}
.lines{flex:1;overflow:auto;min-height:0}
.line{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:calc(var(--u)*3);min-height:max(var(--row),var(--floor));padding:calc(var(--u)*1.5) calc(var(--u)*4);border-bottom:var(--hair) solid var(--border);position:relative;transition:background-color 800ms var(--ease)}
.line.settle{background:color-mix(in oklch,var(--primary) 10%,transparent);transition:none}
.line .q{min-width:calc(var(--ctl) - 8px);height:calc(var(--ctl) - 8px);border:var(--hair) solid var(--border);border-radius:calc(var(--r) - 2px);display:inline-flex;align-items:center;justify-content:center;font-weight:600;padding:0 calc(var(--u)*2)}
.line .q.ring{border-color:var(--ring)}
.line .n{line-height:1.3}
.line .n .sub{color:var(--muted-fg);font-size:calc(var(--fs)*.86)}
.totals{padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*2);border-top:var(--hair) solid var(--border);flex:none}
.totals .r2{display:flex;justify-content:space-between;align-items:baseline;padding:calc(var(--u)*.75) 0}
.totals .big{font-size:calc(var(--fs)*1.3);font-weight:700;padding-top:calc(var(--u)*1.5)}
.cart-f2{display:flex;gap:calc(var(--u)*2);padding:0 calc(var(--u)*4) calc(var(--u)*2);flex:none}
.cart-f2 .btn{flex:1}
.cart-f{display:flex;gap:calc(var(--u)*2);padding:0 calc(var(--u)*4) calc(var(--u)*4);flex:none}
.cart-f .btn.xl{flex:1}
.tabsrow{display:flex;gap:calc(var(--u)*1.5);padding:calc(var(--u)*2) calc(var(--u)*4);border-top:var(--hair) solid var(--border);overflow-x:auto;flex:none;align-items:center}
.tabsrow.top{border-top:0;border-bottom:var(--hair) solid var(--border)}
.tab{height:max(calc(var(--ctl) - 8px),var(--floor));padding:0 calc(var(--u)*3);border-radius:var(--r);border:var(--hair) solid var(--border);display:inline-flex;align-items:center;gap:calc(var(--u)*2);white-space:nowrap;color:var(--muted-fg)}
.tab.on{color:var(--fg);font-weight:600;border-color:var(--fg)}
.tab.plus{width:max(calc(var(--ctl) - 8px),var(--floor));padding:0;justify-content:center}
.toast{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(max(var(--ctl),var(--floor)) + var(--u)*3);z-index:5;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:calc(var(--u)*2.5) calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*2);animation:drop var(--t) var(--ease)}
.toast .ck{width:18px;height:18px;border-radius:50%;background:var(--ok);display:inline-flex;align-items:center;justify-content:center;flex:none}
.toast .ck svg{width:11px;height:11px;stroke:#fff;stroke-width:2.5}
.toast .undo{margin-left:auto;font-weight:600;text-decoration:underline;text-underline-offset:3px}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---- gate cards (open register, pick register) and the count ---- */

function jump(scn){
  Object.assign(S,{scn, panel:false, sheet:null, tender:false, view:'keypad', entry:null, method:'cash', toast:null, settle:null, online:true, long:false, pop:null, phoneTab:'cart', counted:'', open:'200.00', movOpen:false});
  switch(scn){
    case 'added': S.settle='line'; S.toast=null; break;
    case 'panel': S.panel=true; break;
    case 'closure': S.sheet='closure'; break;
    case 'offline': S.online=false; break;
    case 'loading': case 'noresults': case 'settings': S.phoneTab='products'; if(scn==='settings') S.pop='products'; break;
    case 'tender': S.tender=true; S.phoneTab='products'; break;
    case 'tender-card': S.tender=true; S.view='terminal'; S.method='sumup'; S.phoneTab='products'; break;
    case 'paid': S.tender=true; S.view='paid'; S.phoneTab='products'; break;
    case 'long': S.long=true; break;
    case 'counting': S.counted='463.30'; break;
  }
  render();
}

function renderTender(){
  const t=T(); const total=sub(); const entry=S.entry??total; const ghost=S.entry===null; const m=METHODS.find(x=>x.id===S.method);
  if (S.view==='paid'){
    const change = S.entry && S.entry>total ? S.entry-total : 0;
    return `<div class="pay"><div class="paidwrap"><span class="disc">${I.check}</span><div class="h money">${change>0?`${t.change} ${fmt(change)}`:`${t.paid} ${fmt(total)}`}</div><div class="mut">${change>0?`${t.paid} ${fmt(total)} · tendered ${fmt(S.entry)} in Cash`:`${fmt(total)} · SumUp · contactless`}</div>
      <div class="acts"><button class="btn xl p press" data-act="newSale">${I.print}${t.printNew}</button><button class="btn press" data-act="newSale">${t.email}</button><button class="btn q press" data-act="newSale">${t.noRcpt}</button></div></div></div>`;
  }
  if (S.view==='terminal'){
    return `<div class="pay"><div class="hd"><button class="ibtn press" data-act="closeTender" aria-label="Close">${I.x}</button><span class="mut">Order <b>#102476</b> · 3 ${t.items} · ${t.guest}</span></div>
      <div class="paidwrap"><span class="disc" style="background:var(--muted)"><svg viewBox="0 0 24 24" style="stroke:var(--fg)"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10 7h4M10 11h4"/></svg></span><div class="h money">${fmt(total)}</div><div class="mut">On the SumUp terminal · waiting for the card</div>
      <div class="st info" style="justify-content:center"><i></i>Reader connected · 82%</div>
      <div class="acts"><button class="btn press" data-act="closeTender">Cancel payment</button></div></div></div>`;
  }
  const change = m.change && entry>total ? entry-total : 0;
  const short = entry<total ? total-entry : 0;
  let line=''; if(change>0) line=`<span class="chg">${t.change} ${fmt(change)}</span>`; else if(short>0) line=`Part payment · ${fmt(short)} left after this`;
  const helpers = m.change ? [50,100].map(n=>`<button class="chip press ${entry===n?'on':''}" data-act="entry" data-v="${n}">${fmt(n)}</button>`).join('')+`<button class="chip press ${ghost?'on':''}" data-act="entry" data-v="">${t.exactAmt} ${fmt(total)}</button>`
    : `<button class="chip press ${ghost?'on':''}" data-act="entry" data-v="">Full balance ${fmt(total)}</button>`;
  const commit = m.k==='terminal' ? `Send ${fmt(Math.min(entry,total))} to ${m.t}` : `${t.take} ${fmt(Math.min(entry,total))} ${t.in} ${m.t}`;
  return `<div class="pay">
    <div class="hd"><button class="ibtn press" data-act="closeTender" aria-label="Close">${I.x}</button><span class="mut ell">Order <b>#102476</b> · 3 ${t.items} · ${t.guest}</span><span class="grow"></span><span class="segc"><button class="on">${t.payments}</button><button>${t.legacy}</button></span></div>
    <div class="amtblock"><div class="lbl">${t.toPay} <span class="money">${fmt(total)}</span><button class="chip press" style="text-transform:none;letter-spacing:0;height:calc(var(--fs)*1.9)">${t.split}</button>${!S.online?`<span class="pill warn">${I.cloudoff}${t.offline}</span>`:''}</div><div class="big money ${ghost?'ghost':''}">${fmt(entry)}</div><div class="line">${line}</div></div>
    <div class="methods">${METHODS.map(x=>`<button class="mt press ${x.id===S.method?'on':''}" data-act="method" data-m="${x.id}">${I[x.k]}<span class="ell">${x.t}</span>${x.dot?`<span class="dot"></span>`:''}</button>`).join('')}</div>
    <div class="unav xs">${UNAVAIL.length} ${t.notAvail} · ${UNAVAIL.map(([n,w])=>`${n} (${w})`).join(', ')}</div>
    <div class="sp"></div>
    <div class="helpers">${helpers}</div>
    <div class="keys">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button class="k press" data-act="key" data-k="${k}">${k}</button>`).join('')}<button class="k sub press" data-act="key" data-k="C">C</button><button class="k press" data-act="key" data-k="0">0</button><button class="k sub press" data-act="key" data-k="⌫">${I.del}</button></div>
    <div class="commit"><button class="btn xl p press" data-act="take">${commit}</button></div>
  </div>`;
}
function renderLedger(){
  const t=T(); const items=lines(); const s=sub();
  const paid = S.view==='paid' ? s : 0;
  const payRow = S.view==='paid' ? `<div class="line"><span></span><span class="n">${S.method==='cash'?'Cash':'SumUp'}<span class="sub" style="display:block">${S.method==='cash'?'Tendered':'Contactless'} · <span class="st ok"><i></i>Captured</span></span></span><span class="money b">${fmt(s)}</span></div>`
    : S.view==='terminal' ? `<div class="line"><span></span><span class="n">SumUp<span class="sub" style="display:block"><span class="st warn"><i></i>Waiting on the terminal</span></span></span><span class="money">${fmt(s)}</span></div>` : `<div class="mut" style="padding:0 calc(var(--u)*4) calc(var(--u)*3)">No payments yet</div>`;
  return `<div class="cartcol ledger">${renderBar()}
    <div class="custrow"><span class="b">#102476</span><span class="mut">${t.guest}</span></div>
    <div class="lines">${items.map(([n,q,p])=>`<div class="line"><span class="q">${q}</span><span class="n ell">${n}</span><span class="money">${fmt(q*p)}</span></div>`).join('')}<div class="pl">${t.payments}</div>${payRow}</div>
    <div class="totals"><div class="r2 mut"><span>${t.total}</span><span class="money">${fmt(s)}</span></div><div class="r2 mut"><span>${t.paid}</span><span class="money">${fmt(paid)}</span></div><div class="r2 big"><span>${paid>=s?t.paid:'Remaining'}</span><span class="money">${fmt(s-paid)}</span></div></div>
    ${renderTabs('bottom')}</div>`;
}

function renderPOS(){
  const t=T(); const phone=S.w==='phone';
  if (S.tender){
    if (phone) return `<div class="screen">${renderTender()}</div>`;
    return `<div class="screen">${renderTender()}${renderLedger()}</div>`;
  }
  if (!phone) return `<div class="screen">${renderProducts()}${renderCartColumn()}</div>`;
  const n=lines().length; const badge = n?`<span class="badge">${n}</span>`:'';
  return `<div class="screen">${S.phoneTab==='products'?renderProducts():renderCartColumn()}
    <div class="tabbar"><button class="press ${S.phoneTab==='products'?'on':''}" data-set="phoneTab" data-v="products">${I.products}${t.products}</button><button class="press ${S.phoneTab==='cart'?'on':''}" data-set="phoneTab" data-v="cart">${badge}${I.cart}${sessionOpen()?t.cart:t.register}</button></div></div>`;
}

function renderNotes(){
  const rows = [
    ['Scale step', S.scale, {compact:'unit 3.5 · base 13 · control 40 (44 on touch) · row 36 (44 on touch) · tile 56 · radius 6', regular:'unit 4 · base 14 · control 44 · row 44 · tile 64 · radius 8', spacious:'unit 5 · base 16 · control 52 · row 52 · tile 80 · radius 10'}[S.scale]],
    ['Pointer', S.w==='desktop'?'fine (mouse)':'coarse (touch)', S.w==='desktop'?'controls may sit under 44 at the compact step; WCAG 24 floor':'nothing interactive under 44 pt at any step'],
    ['Focus', '', {open:'search field, on open; the scanner is captured anywhere', added:'the quantity of the line just added; Enter checks out', tender:'the amount; digits type, Enter takes the selected method, Esc closes', closed:'the float amount; Enter opens the register', counting:'the counted amount; Enter closes and prints'}[S.scn]||'—'],
  ];
  document.getElementById('notes').innerHTML = `<b>Prototype for wcpos/roadmap#287.</b> The dark strip is not part of the design. ` + rows.map(([k,v,d])=>`<span style="display:inline-block;margin-right:16px"><b>${k}:</b> ${v} <span style="color:#6b7280">${d}</span></span>`).join('');
}

function render(){
  renderStrip();
  const f=document.getElementById('frame');
  f.className='frame'; f.dataset.w=S.w; f.dataset.theme=S.theme; f.dataset.scale=S.scale;
  f.innerHTML=`<div class="body">${S.w==='phone'?'':renderRail()}<div class="main">${renderPOS()}${renderPanel()}${renderSheet()}</div></div>`;
  renderNotes();
}

/* =====================================================================
   Interaction — enough to feel it; nothing persists.
   ===================================================================== */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-set],[data-scn],[data-act]'); if(!b) return;
  if (b.dataset.set){ const v=b.dataset.v; S[b.dataset.set]= (v==='1'||v==='3')?+v:v; render(); return; }
  if (b.dataset.scn && !b.dataset.act){ jump(b.dataset.scn); return; }
  const a=b.dataset.act;
  switch(a){
    case 'noop': break;
    case 'jumpTo': jump(b.dataset.scn); return;
    case 'addLine': if(!sessionOpen()) break; S.scn='added'; S.settle='line'; S.phoneTab='cart'; render(); setTimeout(()=>{ if(S.settle==='line'){ S.settle=null; document.querySelectorAll('.line.settle').forEach(n=>n.classList.remove('settle')); } }, 900); return;
    case 'openPanel': S.panel=true; break;
    case 'closePanel': if (e.target.closest('[data-stop]') && !b.classList.contains('ibtn')) return; S.panel=false; break;
    case 'openSheet': S.sheet=b.dataset.sheet; break;
    case 'closeSheet': if (e.target.closest('[data-stop]') && !b.classList.contains('ibtn') && !b.classList.contains('btn')) return; S.sheet=null; if(S.scn==='closure') S.scn='closed'; break;
    case 'startCount': S.panel=false; S.scn='counting'; S.counted=''; break;
    case 'doOpen': S.scn='open'; break;
    case 'togglePop': S.pop = S.pop===b.dataset.pop ? null : b.dataset.pop; break;
    case 'toggleMov': S.movOpen=!S.movOpen; break;
    case 'checkout': S.tender=true; S.view='keypad'; S.entry=null; S.method='cash'; break;
    case 'closeTender': S.tender=false; S.view='keypad'; break;
    case 'method': S.method=b.dataset.m; S.entry=null; break;
    case 'entry': S.entry = b.dataset.v===''?null:+b.dataset.v; break;
    case 'key': { const k=b.dataset.k; const cur = S.entry===null ? '' : String(Math.round(S.entry*100)); let d = k==='C' ? '' : k==='⌫' ? cur.slice(0,-1) : (cur+k).slice(0,8); S.entry = d===''?null:+d/100; break; }
    case 'take': { const m=METHODS.find(x=>x.id===S.method); if(m.k==='terminal'){ S.view='terminal'; render(); setTimeout(()=>{ if(S.view==='terminal'){ S.view='paid'; render(); } }, 2200); return; } S.view='paid'; break; }
    case 'newSale': S.tender=false; S.view='keypad'; S.entry=null; S.scn='empty'; break;
  }
  render();
});
document.addEventListener('input', e=>{ if(e.target.dataset.count){ S.counted=e.target.value; const pos=e.target.selectionStart; render(); const n=document.querySelector('[data-count]'); if(n){n.focus(); n.setSelectionRange(pos,pos);} } });
document.addEventListener('keydown', e=>{
  if (!S.tender || S.view!=='keypad') return;
  if (/^[0-9]$/.test(e.key)) { document.querySelector(`[data-act="key"][data-k="${e.key}"]`)?.click(); }
  else if (e.key==='Backspace') document.querySelector('[data-act="key"][data-k="⌫"]')?.click();
  else if (e.key==='Enter') document.querySelector('[data-act="take"]')?.click();
  else if (e.key==='Escape') document.querySelector('[data-act="closeTender"]')?.click();
});
render();
</script>
</body>
</html>
