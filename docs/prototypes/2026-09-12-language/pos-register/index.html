.frame[data-w="desktop"]{--floor:24px}   /* fine pointer: WCAG floor, not the touch floor */

/* ---- page chrome (not the design) ---- */
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;background:#e6e8ec;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.strip{position:sticky;top:0;z-index:50;background:#111827;color:#e5e7eb;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:12px}
.strip .g{display:flex;align-items:center;gap:6px}
.strip .g>b{color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.seg{display:inline-flex;border:1px solid #374151;border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#d1d5db;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:#f3f4f6;color:#111827;font-weight:600}
.stage{padding:20px 24px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.notes{max-width:1180px;width:100%;font-size:13px;color:#374151;line-height:1.5}
.notes b{color:#111}

/* ---- the frame ---- */
.frame{background:var(--bg);color:var(--fg);font-size:var(--fs);line-height:1.35;overflow:clip;position:relative;display:flex;flex-direction:column;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--display:var(--font);--mono:var(--font);
  font-family:var(--font);font-variant-numeric:tabular-nums;border:1px solid #c9ced6}
.frame[data-w="desktop"]{width:1440px;height:860px;border-radius:8px}
.frame[data-w="tablet"]{width:1024px;height:768px;border-radius:12px}
.frame[data-w="phone"]{width:390px;height:844px;border-radius:36px;border:8px solid #111}
.frame *{font-variant-numeric:tabular-nums}
:where(.frame) button,:where(.frame) input{font:inherit;color:inherit;font-family:inherit}
:where(.frame) button{cursor:pointer;background:none;border:0;padding:0}
.frame svg{width:calc(var(--fs) * 1.35);height:calc(var(--fs) * 1.35);flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.frame :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.frame .ring{outline:2px solid var(--ring);outline-offset:2px}
.mut{color:var(--muted-fg)} .sm{font-size:calc(var(--fs)*.93)} .xs{font-size:calc(var(--fs)*.86)} .b{font-weight:600}
.money{white-space:nowrap} .neg{color:var(--bad)} .up{color:var(--ok)} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:calc(var(--u)*2)} .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.press{transition:background-color 80ms var(--ease),transform 80ms var(--ease),border-color 80ms var(--ease)} .press:active{transform:scale(.985)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);height:max(var(--ctl),var(--floor));padding:0 calc(var(--u)*4);border-radius:var(--r);border:var(--hair) solid var(--border);background:var(--card);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:active{background:var(--muted)} .btn.p{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:600} .btn.p:active{filter:brightness(.92)}
.btn.q{background:transparent;border-color:transparent} .btn.q:active{background:var(--muted)} .btn.d{color:var(--destructive)} .btn.xl{height:max(calc(var(--tile) * .875),var(--floor));font-size:calc(var(--fs) * 1.14)} .btn:disabled{opacity:.45;cursor:default}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);color:var(--muted-fg)} .ibtn:active{background:var(--muted)} .ibtn.on{color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:max(calc(var(--ctl) - 8px),var(--floor));padding:0 calc(var(--u)*3);border-radius:999px;border:var(--hair) solid var(--border);background:var(--card);white-space:nowrap} .chip.on{border-color:var(--primary);color:var(--primary);font-weight:600}
.in{height:max(var(--ctl),var(--floor));border:var(--hair) solid var(--border);border-radius:var(--r);background:var(--card);padding:0 calc(var(--u)*3);width:100%;outline:none} .in::placeholder{color:var(--muted-fg)} .in:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.st{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);white-space:nowrap} .st i{width:8px;height:8px;border-radius:50%;background:var(--neutral);flex:none} .st.ok i{background:var(--ok)} .st.warn i{background:var(--warn)} .st.bad i{background:var(--bad)} .st.info i{background:var(--info)}
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:calc(var(--fs)*1.7);padding:0 calc(var(--u)*2.5);border-radius:999px;font-size:calc(var(--fs)*.86);font-weight:600;border:var(--hair) solid var(--border);color:var(--muted-fg);white-space:nowrap} .pill.warn{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 45%,transparent)}
.segt{display:inline-flex;border:var(--hair) solid var(--border);border-radius:var(--r);overflow:hidden;height:max(var(--ctl),var(--floor));background:var(--card)}
.segt button{padding:0 calc(var(--u)*3);color:var(--muted-fg);display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);font-weight:500;min-width:max(var(--ctl),var(--floor))}
.segt button.on{background:var(--muted);color:var(--fg);font-weight:600}
.segt button+button{border-left:var(--hair) solid var(--border)}
.body{flex:1;display:flex;min-height:0}
.rail{width:max(56px,calc(var(--ctl) + var(--u)*3));background:var(--rail);border-right:var(--hair) solid var(--rail-border);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*2) 0;gap:var(--u);flex:none}
/* the cashier at the top of the rail (Paul 2026-09-17); the sheet with their sales opens from it */
.rail .avr{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));display:flex;align-items:center;justify-content:center;margin-bottom:calc(var(--u)*2)} .rail .avr .av{width:calc(var(--ctl) - 8px);height:calc(var(--ctl) - 8px);background:var(--primary);color:var(--primary-fg);font-size:calc(var(--fs)*.86)}
.rail .it{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--rail-fg);position:relative} .rail .it.on{background:var(--card);color:var(--primary);border:var(--hair) solid var(--rail-border)} .rail .sp{margin-top:auto}
.main{flex:1;min-width:0;display:flex;position:relative;overflow:hidden}
.screen{flex:1;display:flex;min-width:0} .frame[data-w="phone"] .screen{flex-direction:column}

/* the column divider: 8 px, draggable, grip on hover (web) or always faint (touch) */
.divider{width:8px;flex:none;position:relative;cursor:col-resize;background:var(--bg)}
.divider::after{content:"";position:absolute;left:2px;top:50%;width:4px;height:48px;margin-top:-24px;border-radius:2px;background:var(--border);opacity:.9;transition:background-color var(--t)}
.frame[data-w="desktop"] .divider::after{opacity:0} .frame[data-w="desktop"] .divider:hover::after{opacity:1;background:var(--muted-fg)}
.divider:active::after{background:var(--primary)}

/* ---- products column ---- */
.prodcol{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
:where(.frame[data-screen="register"]) .toolbar{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*3) 0 calc(var(--u)*3) calc(var(--u)*4);flex:none}
.frame:where([data-screen="register"])[data-w="phone"] .toolbar{padding:calc(var(--u)*2.5) calc(var(--u)*3)}
.search{position:relative;flex:1} .search svg{position:absolute;left:calc(var(--u)*3);top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none} .search .in{padding-left:calc(var(--u)*3 + var(--fs)*1.35 + var(--u)*2)}
:where(.frame[data-screen="register"]) .tiles{display:grid;gap:calc(var(--u)*3);padding:0 0 calc(var(--u)*4) calc(var(--u)*4);overflow:auto;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tile) * 2.5),1fr))}
/* the filter bar (the app's pills, with their icons; users add their own) */
.fbar{display:flex;align-items:center;gap:calc(var(--u)*1.5);padding:0 0 calc(var(--u)*2.5) calc(var(--u)*4);flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth;mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
:where(.frame[data-screen="register"]) .pill{display:inline-flex;align-items:center;gap:calc(var(--u)*1.25);height:max(calc(var(--ctl) - 12px),32px);padding:0 calc(var(--u)*2.5) 0 calc(var(--u)*3);border-radius:999px;border:var(--hair) solid var(--border);background:var(--card);color:var(--fg);white-space:nowrap;font-size:calc(var(--fs)*.93)} :where(.frame[data-screen="register"]) .pill svg{width:14px;height:14px;color:var(--muted-fg)} :where(.frame[data-screen="register"]) .pill.q{border-style:dashed} .pill.add{padding:0 calc(var(--u)*2.5);color:var(--muted-fg)} :where(.frame[data-screen="register"]) .pill:active{background:var(--muted)}
/* the row is the button (Paul 2026-09-17, every tablet POS): a tap anywhere adds; the last column's + becomes the in-cart count */
.tr.rowbtn{cursor:pointer} .tr.rowbtn:active{background:color-mix(in oklch,var(--primary) 10%,transparent)}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 calc(var(--u)*2);border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:calc(var(--fs)*.93);font-weight:700}
/* the footer: icons and values (decided 2026-09-17): % Shop base ▾ · n of m · sync */
:where(.frame[data-screen="register"]) .tfoot{display:flex;align-items:center;gap:calc(var(--u)*3);height:max(var(--ctl),var(--floor));border-top:var(--hair) solid var(--border);color:var(--muted-fg);padding:0 var(--u) 0 calc(var(--u)*3);flex:none;font-size:calc(var(--fs)*.9)} .tfoot .tax{display:inline-flex;align-items:center;gap:calc(var(--u)*1);white-space:nowrap;cursor:pointer} .tfoot .tax b{color:var(--fg);font-weight:500} .tfoot .tax svg{width:14px;height:14px} .tfoot .fi{width:22px;height:22px;border-radius:5px;background:var(--muted);display:inline-flex;align-items:center;justify-content:center;margin-right:2px} .tfoot .fi svg{width:13px;height:13px}
/* the stage: the table slides on it (Paul 2026-09-17, board 4); the exiting pane dims and moves a quarter left, the entering one comes from the right */
.ptable{position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform 280ms var(--ease),opacity 280ms var(--ease);will-change:transform}
.pane.enter-r{transform:translateX(100%)} .pane.exit-l{transform:translateX(-24%);opacity:.35} .pane.enter-l{transform:translateX(-24%);opacity:.35} .pane.exit-r{transform:translateX(100%)} .pane.under{z-index:0} .pane.over{z-index:1}
:where(.frame[data-screen="register"]) .crumb{display:flex;align-items:center;gap:calc(var(--u)*1);height:max(var(--ctl),40px);flex:none;color:var(--muted-fg);font-size:calc(var(--fs)*.93);padding-right:calc(var(--u)*2)} :where(.frame[data-screen="register"]) .crumb button{display:inline-flex;align-items:center;gap:calc(var(--u)*1);height:36px;padding:0 calc(var(--u)*2) 0 calc(var(--u)*1);border-radius:var(--r);color:var(--fg);font-weight:500} :where(.frame[data-screen="register"]) .crumb button:hover{background:var(--muted)} :where(.frame[data-screen="register"]) .crumb button svg{width:16px;height:16px} .crumb .sep{color:var(--border);font-size:calc(var(--fs)*1.2)} .crumb .here{color:var(--fg);font-weight:600;padding:0 calc(var(--u)*1)} .crumb .num{margin-left:calc(var(--u)*1)}
.crumb .pv{display:inline-flex;align-items:center;gap:calc(var(--u)*2);margin-left:auto;color:var(--muted-fg)} .crumb .pv .img{width:28px;height:28px;border-radius:6px;background:var(--muted)}
.fwrap{position:relative;flex:none} .fwrap .menu{position:absolute;left:calc(var(--u)*4);top:calc(100% - var(--u)*1.5);z-index:5;background:var(--card);border:var(--hair) solid var(--border);border-radius:10px;box-shadow:0 8px 24px oklch(0.2 0.02 250 / .14);padding:6px;min-width:200px} .fwrap .menu button{display:flex;align-items:center;gap:8px;width:100%;height:max(calc(var(--ctl) - 8px),40px);padding:0 10px;border-radius:6px;white-space:nowrap;color:var(--fg)} .fwrap .menu button:hover{background:var(--muted)} .fwrap .menu button .n{margin-left:auto;color:var(--muted-fg);font-size:calc(var(--fs)*.86)}
/* the grid's drill-in is the stagger (Paul 2026-09-17, board 5): the old tiles drop out together, the new ones land one after another; the breadcrumb is plain, it just appears */
.pane.sout .tile{animation:tout 140ms var(--ease) both} @keyframes tout{to{opacity:0;transform:scale(.97)}}
.pane .tile.tin{animation:tin 260ms var(--ease) both} @keyframes tin{from{opacity:0;transform:translateY(10px) scale(.97)}}
.ptable.grid{margin-left:0} .ptable.grid .crumb{padding-left:calc(var(--u)*4)} .ptable.grid .tiles{flex:1;min-height:0;align-content:start} .fbar::-webkit-scrollbar{display:none}
.tile .vbadge{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--muted-fg);box-shadow:0 1px 2px oklch(0.2 0.02 250 / .12)} .tile .vbadge svg{width:14px;height:14px}
.tile .tcnt{position:absolute;left:6px;top:6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:calc(var(--fs)*.75);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
/* a chip that does not apply at this level (product filters inside a product's variations) stays on but dims */
.pill.split{padding:0;overflow:hidden;flex:none;min-width:max-content} .pill.split>button{height:100%;display:inline-flex;align-items:center;gap:5px;padding:0 8px 0 12px;color:inherit;font-weight:inherit} .pill.split>button.x{padding:0 10px 0 8px;border-left:var(--hair) solid color-mix(in srgb,var(--bg) 30%,transparent)} .pill.split>button.x svg{width:12px;height:12px}

const fmt0 = n => fmt(n);
const pct = n => Math.round(n * 100) + '%';

const r2 = n => Math.round(n * 100) / 100;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const h01 = s => { let x = 7; for (const c of String(s)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return (x % 1000) / 1000; };
const dateOf = off => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - off);
const wdOf = off => (dateOf(off).getDay() + 6) % 7; // 0 = Monday
const isoOf = off => { const d = dateOf(off); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dstr = off => { const d = dateOf(off); return `${WD[wdOf(off)]} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`; };

/* ============================ period model ============================ */
function dayTotal(off) {
  if (off === 0) return sum(ORDERS, o => o.total);
  if (DAYTOTAL_OVERRIDE[off] != null) return DAYTOTAL_OVERRIDE[off];
  return r2(640 + DP[wdOf(off)] * 7 * 300 + h01('d' + off) * 380);
}
function hourly(off, list) { // array over HOURS
  if (list) { const a = HOURS.map(() => 0); list.forEach(o => { const i = HOURS.indexOf(o.hour); if (i >= 0) a[i] += o.total; }); return a; }
  const t = dayTotal(off); return P.map(p => r2(t * p));
}
function monthDays(off) { // days of the month `off` months back: [{off, d}]
  const first = new Date(TODAY.getFullYear(), TODAY.getMonth() - off, 1);
  const n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const out = []; for (let d = 1; d <= n; d++) { const dt = new Date(first.getFullYear(), first.getMonth(), d); out.push({ d, off: Math.round((TODAY - dt) / 86400000) }); }
  return out;
}
// buckets: [{label, off, cur:bool (has happened), val}]
function buckets(gran, off) {
  if (gran === 'day') return HOURS.map(h => ({ label: h === 12 ? '12pm' : h > 12 ? (h - 12) + 'pm' : h + 'am', hour: h, past: off > 0 || h <= NOWH }));
  if (gran === 'week') return WD.map((w, i) => ({ label: w, off: off * 7 - i, past: off * 7 - i >= 0 }));
  if (gran === 'month') return monthDays(off).map(x => ({ label: String(x.d), off: x.off, past: x.off >= 0 }));
  const n = RS.cFrom - RS.cTo + 1, out = [];
  for (let i = 0; i < n; i++) { const o = RS.cFrom - i + off * n; out.push({ label: String(dateOf(o).getDate()), off: o, past: o >= 0 }); }
  return out;
}
function periodTitle(gran, off) {
  const m3 = d => MON[d.getMonth()].slice(0, 3);
  if (gran === 'day') return off === 0 ? 'Today' : off === 1 ? 'Yesterday' : `${WDL[wdOf(off)]} ${dateOf(off).getDate()} ${m3(dateOf(off))}`;
  if (gran === 'week') return off === 0 ? 'This week' : off === 1 ? 'Last week' : `Week of ${dateOf(off * 7).getDate()} ${m3(dateOf(off * 7))}`;
  if (gran === 'month') { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - off, 1); return off === 0 ? 'This month' : off === 1 ? 'Last month' : MON[d.getMonth()]; }
  const b = buckets('custom', off), a = dateOf(b[0].off), z = dateOf(b[b.length - 1].off);
  return a.getMonth() === z.getMonth() ? `${a.getDate()}–${z.getDate()} ${m3(z)}` : `${a.getDate()} ${m3(a)} – ${z.getDate()} ${m3(z)}`;
}
const CMP_OFF = { lastweek: 7, yesterday: 1 };   /* Paul 2026-09-17: yesterday by default; same day last week is the one alternative */
const CMP_LABEL = { lastweek: 'same day last week', yesterday: 'the day before' };
function refLabel() {
  if (RS.gran === 'day') return RS.off === 0 ? { lastweek: `last ${WDL[0]}`, yesterday: 'yesterday' }[RS.cmp] : CMP_LABEL[RS.cmp];
  if (RS.gran === 'week') return 'the week before';
  if (RS.gran === 'month') return `${MON[(TODAY.getMonth() - RS.off - 1 + 12) % 12]}`;
  return `the ${RS.cFrom - RS.cTo + 1} days before`;
}
/* orders in the period (today = real; anything else = synthetic, shaped like today) */
const ORD_CACHE = {};
function ordersFor(gran, off) {
  const key = gran + ':' + off + (gran === 'custom' ? ':' + RS.cFrom + ':' + RS.cTo : '');
  if (ORD_CACHE[key]) return ORD_CACHE[key];
  let list;
  if (gran === 'day' && off === 0) list = ORDERS.map(o => ({ ...o, key: 'day:0:' + o.n }));
  else {
    const raw = gran === 'day' ? dayTotal(off) : sum(buckets(gran, off).filter(b => b.past), b => dayTotal(b.off));
    const n = Math.max(3, Math.round(raw / 88.6));
    list = []; let acc = 0;
    for (let i = 0; i < n; i++) { const b = ORDERS[i % ORDERS.length]; const w = b.total * (0.7 + h01(key + i) * 0.6); list.push({ ...b, n: 1226 - (off * 40 + i), w, key: key + ':' + i }); acc += w; }
    const k = raw / acc; list.forEach(o => { o.total = r2(o.w * k); o.tax = r2(o.total / 6); delete o.w; });
    if (gran === 'day') list.forEach((o, i) => { o.hour = HOURS[Math.min(11, 1 + Math.floor(i * 11 / n))]; o.time = String(o.hour).padStart(2, '0') + ':' + String(Math.floor(h01('t' + o.key) * 60)).padStart(2, '0'); });
    list.sort((a, b) => a.time < b.time ? -1 : 1);
  }
  if (RS.cashier !== 'all') list = list.filter(o => o.cashier === RS.cashier);
  return ORD_CACHE[key] = list;
}
const ticked = list => list.filter(o => !RS.unticked.has(o.key));

function model() {
  const all = ordersFor(RS.gran, RS.off), t = ticked(all);
  const rawAll = sum(all, o => o.total), total = sum(t, o => o.total), scale = rawAll ? total / rawAll : 1;
  const bk = buckets(RS.gran, RS.off);
  let cur, prev, prevRef, prevTotal;
  if (RS.gran === 'day') {
    cur = hourly(RS.off, t);
    prev = hourly(RS.off + CMP_OFF[RS.cmp]);
    prevTotal = sum(prev);
    prevRef = RS.off === 0 ? sum(prev.filter((_, i) => HOURS[i] <= NOWH)) : prevTotal;
  } else {
    cur = bk.map(b => b.past ? r2(dayTotal(b.off) * scale) : 0);
    const pb = buckets(RS.gran, RS.off + 1);
    prev = bk.map((b, i) => pb[i] ? dayTotal(pb[i].off) : 0);
    prevTotal = sum(prev);
    prevRef = RS.off === 0 ? sum(prev.filter((_, i) => bk[i].past)) : prevTotal;
  }
  const orders = t.length, prevOrders = Math.max(1, Math.round(prevRef / 88.6));
  const items = sum(t, o => o.items), prevItems = Math.round(prevOrders * 2.2);
  // busiest bucket
  let bi = 0; cur.forEach((v, i) => { if (v > cur[bi]) bi = i; });
  const busiest = cur[bi] > 0 ? { label: RS.gran === 'day' ? bk[bi].label.replace('am', ' am').replace('pm', ' pm') : (RS.gran === 'week' ? WDL[bi] : `the ${bk[bi].label}${['th','st','nd','rd'][(bk[bi].label % 10 < 4 && ![11,12,13].includes(+bk[bi].label)) ? bk[bi].label % 10 : 0]}`), val: cur[bi], n: RS.gran === 'day' ? t.filter(o => o.hour === bk[bi].hour).length : null } : null;
  const by = (f) => { const m = {}; t.forEach(o => { m[f(o)] = (m[f(o)] || 0) + o.total; }); return m; };
  const cnt = (f) => { const m = {}; t.forEach(o => { m[f(o)] = (m[f(o)] || 0) + 1; }); return m; };
  return { all, t, total, scale, bk, cur, prev, prevRef, prevTotal, orders, prevOrders, items, prevItems, busiest,
    byMethod: by(o => o.method), cntMethod: cnt(o => o.method), byChannel: by(o => o.channel), cntChannel: cnt(o => o.channel),
    byCashier: by(o => o.cashier), cntCashier: cnt(o => o.cashier), tax: sum(t, o => o.tax), excluded: all.length - t.length };
}

const deltaCls = (cur, prev) => { if (!prev) return 'flat'; const d = (cur - prev) / prev; return Math.abs(d) * 100 < 0.5 ? 'flat' : d > 0 ? 'up' : 'down'; };

    case 'products': spec = { head: ['Product', 'Qty', 'Amount'], rows: PRODUCTS.map(([n, s]) => [esc(n), Math.max(1, Math.round(m.items * s * 1.1)), fmt(r2(T * s))]), tot: ['All products', m.items, fmt(m.total)] }; break;
    case 'categories': spec = { head: ['Category', 'Qty', 'Amount', 'Share'], rows: [['Coffee', .41], ['Bakery', .29], ['Retail', .18], ['Uncategorised', .12]].map(([n, s]) => [n, Math.max(1, Math.round(m.items * s)), fmt(r2(T * s)), pct(s)]), tot: ['Total', m.items, fmt(m.total), ''] }; break;

function wrapPanel(title, sub, hdrExtra, body, foot) {

    ['Payments', [['Cash', fmt(d.cash)], ['Card', fmt(d.card)], ...(d.other ? [['Other', fmt(d.other)]] : [])]],

    inner = `<div class="datepick"><div class="quick">${quick}</div>${calendar()}</div><div class="pf-r"><span class="rp-note-text">${RS.pickStart != null ? 'Tap the last day of the range.' : RS.pro ? 'Tap a day, or two days for a range.' : 'Earlier days are in WCPOS Pro.'}</span><button class="btn p press" data-act="closePop">Done</button></div>`;

/* the calendar: one month, Monday first; the selected period is filled; future days are out; on Free every day but today is locked */
function selectedOffs() {
  if (RS.gran === 'day') return [RS.off];
  if (RS.gran === 'custom') { const a = []; for (let o = RS.cTo; o <= RS.cFrom; o++) a.push(o); return a; }
  return buckets(RS.gran, RS.off).map(b => b.off);
}
function calendar() {
  const first = new Date(TODAY.getFullYear(), TODAY.getMonth() - RS.calMonth, 1), n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, sel = new Set(selectedOffs());
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span></span>');
  for (let d = 1; d <= n; d++) {

function renderFilters(){

  let body='';
  if (S.scn==='loading') body=Array.from({length:8},()=>`<div class="tr sk" style="grid-template-columns:${grid}">${cols.map(()=>`<div class="td"><span></span></div>`).join('')}</div>`).join('');
  else if (S.scn==='error') body=`<div class="empty">${OI.warn}<div class="t">${t.err}</div><div class="row"><button class="btn press">${t.retry}</button><a href="#">${t.docs}</a></div></div>`;

    : `<div class="empty">${I.search}<div class="t">${t.noMatch}</div><button class="btn q press" data-act="clearAll">${t.clear}</button></div>`;
  else if (OS.listStyle==='grouped'){

    body=groups.filter(([,g])=>g.length).map(([l,g])=>`<div class="grp">${I.chevd}<b>${l}</b><span class="n">${g.length}</span><span class="grow"></span><span class="n money">${ofmt(g.reduce((a,o)=>a+o.t,0))}</span></div>`+g.map(o=>{const i=rs.indexOf(o);return `<div class="tr ${OS.open===o.n?'sel':''} ${OS.focus===i?'focus':''}" style="grid-template-columns:${grid}" data-act="openOrder" data-n="${o.n}">${cols.map(c=>cell(c,o)).join('')}</div>`;}).join('')).join('');
  }

function cell(c,o){
  const k=c[0]; const cls=`td ${c[3]}`;
  switch(k){
    case 'status': return `<div class="${cls}"><button class="press" data-act="filterStatus" data-s="${o.s}" style="color:inherit">${st(o.s)}</button></div>`;
    case 'number': return `<div class="${cls} b">${o.n}</div>`;
    case 'customer_id': return `<div class="${cls}">${o.c}${OS.sub.billing&&o.bill?`<span class="sub">${o.bill}</span>`:''}</div>`;
    case 'billing': return `<div class="${cls} mut">${o.bill}</div>`;
    case 'shipping': return `<div class="${cls} mut">${o.bill}</div>`;
    case 'customer_note': return `<div class="${cls}">${o.note?`<span class="mut" title="${o.note}">${I.note}</span>`:''}</div>`;
    case 'date_created_gmt': case 'date_modified_gmt': case 'date_paid_gmt': return `<div class="${cls}">${o.d}</div>`;
    case 'created_via': return `<div class="${cls} mut">${via(o.via)}</div>`;
    case 'cashier': return `<div class="${cls}">${o.cash}</div>`;
    case 'register': return `<div class="${cls}">Front counter</div>`;
    case 'payment_method': return `<div class="${cls}">${o.pm}${OS.sub.paymethod?'':''}</div>`;
    case 'total': return `<div class="${cls} money b">${ofmt(o.t)}${o.ref?`<span class="sub neg">${ofmt(-o.ref)}</span>`:''}</div>`;
    case 'receipt': return `<div class="${cls} mut">${I.print}</div>`;
    case 'actions': return `<div class="${cls}"><button class="ibtn press ${OS.menu===o.n?'on':''}" data-act="menu" data-n="${o.n}" aria-label="Actions" style="width:36px;height:36px">${I.dots}</button></div>`;
  }
  return `<div class="${cls}"></div>`;
}

function click(e){
  const b=e.target.closest('[data-act]');
  if(!b){ if(!e.target.closest('[data-stop]') && (OS.pop||OS.menu)){ OS.pop=null; OS.menu=null; render(); } return; }
  const a=b.dataset.act;
  switch(a){
    case 'pop': OS.pop = OS.pop===b.dataset.pop?null:b.dataset.pop; OS.menu=null; break;
    case 'menu': OS.menu = OS.menu===+b.dataset.n?null:+b.dataset.n; OS.pop=null; break;
    case 'openOrder': if(e.target.closest('[data-act="menu"],[data-act="filterStatus"]')) return; OS.open=+b.dataset.n; OS.pop=null; OS.menu=null; break;
    case 'closeOrder': OS.open=null; break;
    case 'col': OS.cols[b.dataset.k]=!OS.cols[b.dataset.k]; break;
    case 'sub': OS.sub[b.dataset.k]=!OS.sub[b.dataset.k]; break;
    case 'restore': OS.cols=Object.fromEntries(COLS.map(c=>[c[0],c[5]])); OS.sub={billing:false,shipping:false,paymethod:false}; break;
    case 'setFilter': if(b.dataset.v==='all'){ delete OS.filters.status; if(!Object.keys(OS.filters).length && !Object.values(OS.tog).some(Boolean)) S.scn='default'; break; } OS.filters[b.dataset.k]=b.dataset.v; OS.pop=null; if(S.scn==='default') S.scn='filtered'; break;
    case 'tog': OS.tog[b.dataset.k]=!OS.tog[b.dataset.k]; if(Object.values(OS.tog).some(Boolean)){ if(S.scn==='default') S.scn='filtered'; } else if(!Object.keys(OS.filters).length) S.scn='default'; break;
    case 'filterStatus': OS.filters.status=b.dataset.s; S.scn='filtered'; break;
    case 'clearFilter': delete OS.filters[b.dataset.k]; if(!Object.keys(OS.filters).length) S.scn='default'; e.stopPropagation(); break;
    case 'clearAll': OS.filters={}; S.scn='default'; break;
    case 'dismissStrip': S.nostrip=true; break;
    case 'openSheet': OS.sheet=b.dataset.sheet; break;
    case 'closeSheet': if(e.target.closest('[data-stop]') && !b.matches('button')) return; OS.sheet=null; OS.menu=null; OS.toast = b.classList.contains('dd') ? 'Order deleted' : null; if(OS.toast) setTimeout(()=>{OS.toast=null;render();},2200); break;
  }
  render();
}
function keydown(e){
  if(e.key==='Escape'&&OS.sheet){OS.sheet=null;render();return;}
  if (S.w!=='desktop') return; const rs=rows(); if(!rs.length) return;
  if (e.key==='ArrowDown'){ OS.focus = OS.focus==null?0:Math.min(rs.length-1,OS.focus+1); render(); e.preventDefault(); }
  else if (e.key==='ArrowUp'){ OS.focus = Math.max(0,(OS.focus??1)-1); render(); e.preventDefault(); }
  else if (e.key==='Enter' && OS.focus!=null){ OS.open=rs[OS.focus].n; render(); }
  else if (e.key==='Escape'){ if(OS.pop||OS.menu){OS.pop=null;OS.menu=null;} else OS.open=null; render(); }
}
return {render:renderOrders, click, keydown, jump, SCENES};
})();

if(S.screen==='register'&&SCENES.some(([v])=>v===Q.get('scn'))) jump(Q.get('scn')); else render();
</script>
