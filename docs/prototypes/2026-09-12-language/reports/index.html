/* ---- page chrome (not the design) ---- */
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;background:#e6e8ec;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.strip{position:sticky;top:0;z-index:50;background:#111827;color:#e5e7eb;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:12px}
.strip .g{display:flex;align-items:center;gap:6px}
.strip .g>b{color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.seg{display:inline-flex;border:1px solid #374151;border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#d1d5db;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:#f3f4f6;color:#111827;font-weight:600}
.stage{padding:20px 24px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.notes{max-width:1180px;width:100%;font-size:13px;color:#374151;line-height:1.5}
.notes b{color:#111}

/* ---- the frame ---- */
.frame{background:var(--bg);color:var(--fg);font-size:var(--fs);line-height:1.35;overflow:clip;position:relative;display:flex;flex-direction:column;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--display:var(--font);--mono:var(--font);
  font-family:var(--font);font-variant-numeric:tabular-nums;border:1px solid #c9ced6}
.frame[data-w="desktop"]{width:1440px;height:860px;border-radius:8px}
.frame[data-w="tablet"]{width:1024px;height:768px;border-radius:12px}
.frame[data-w="phone"]{width:390px;height:844px;border-radius:36px;border:8px solid #111}
.frame *{font-variant-numeric:tabular-nums}
:where(.frame) button,:where(.frame) input{font:inherit;color:inherit;font-family:inherit}
:where(.frame) button{cursor:pointer;background:none;border:0;padding:0}
.frame svg{width:calc(var(--fs) * 1.35);height:calc(var(--fs) * 1.35);flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.frame :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.frame .ring{outline:2px solid var(--ring);outline-offset:2px}
.mut{color:var(--muted-fg)} .sm{font-size:calc(var(--fs)*.93)} .xs{font-size:calc(var(--fs)*.86)} .b{font-weight:600}
.money{white-space:nowrap} .neg{color:var(--bad)} .up{color:var(--ok)} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:calc(var(--u)*2)} .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.press{transition:background-color 80ms var(--ease),transform 80ms var(--ease),border-color 80ms var(--ease)} .press:active{transform:scale(.985)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);height:max(var(--ctl),var(--floor));padding:0 calc(var(--u)*4);border-radius:var(--r);border:var(--hair) solid var(--border);background:var(--card);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:active{background:var(--muted)} .btn.p{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:600} .btn.p:active{filter:brightness(.92)}
.btn.q{background:transparent;border-color:transparent} .btn.q:active{background:var(--muted)} .btn.d{color:var(--destructive)} .btn.xl{height:max(calc(var(--tile) * .875),var(--floor));font-size:calc(var(--fs) * 1.14)} .btn:disabled{opacity:.45;cursor:default}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);color:var(--muted-fg)} .ibtn:active{background:var(--muted)} .ibtn.on{color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:max(calc(var(--ctl) - 8px),var(--floor));padding:0 calc(var(--u)*3);border-radius:999px;border:var(--hair) solid var(--border);background:var(--card);white-space:nowrap} .chip.on{border-color:var(--primary);color:var(--primary);font-weight:600}
.in{height:max(var(--ctl),var(--floor));border:var(--hair) solid var(--border);border-radius:var(--r);background:var(--card);padding:0 calc(var(--u)*3);width:100%;outline:none} .in::placeholder{color:var(--muted-fg)} .in:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.st{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);white-space:nowrap} .st i{width:8px;height:8px;border-radius:50%;background:var(--neutral);flex:none} .st.ok i{background:var(--ok)} .st.warn i{background:var(--warn)} .st.bad i{background:var(--bad)} .st.info i{background:var(--info)}
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);height:calc(var(--fs)*1.7);padding:0 calc(var(--u)*2.5);border-radius:999px;font-size:calc(var(--fs)*.86);font-weight:600;border:var(--hair) solid var(--border);color:var(--muted-fg);white-space:nowrap} .pill.warn{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 45%,transparent)}
.segt{display:inline-flex;border:var(--hair) solid var(--border);border-radius:var(--r);overflow:hidden;height:max(var(--ctl),var(--floor));background:var(--card)}
.segt button{padding:0 calc(var(--u)*3);color:var(--muted-fg);display:inline-flex;align-items:center;gap:calc(var(--u)*1.5);font-weight:500;min-width:max(var(--ctl),var(--floor))}
.segt button.on{background:var(--muted);color:var(--fg);font-weight:600}
.segt button+button{border-left:var(--hair) solid var(--border)}
.body{flex:1;display:flex;min-height:0}
.rail{width:max(56px,calc(var(--ctl) + var(--u)*3));background:var(--rail);border-right:var(--hair) solid var(--rail-border);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*2) 0;gap:var(--u);flex:none}
/* the cashier at the top of the rail (Paul 2026-09-17); the sheet with their sales opens from it */
.rail .avr{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));display:flex;align-items:center;justify-content:center;margin-bottom:calc(var(--u)*2)} .rail .avr .av{width:calc(var(--ctl) - 8px);height:calc(var(--ctl) - 8px);background:var(--primary);color:var(--primary-fg);font-size:calc(var(--fs)*.86)}
.rail .it{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--rail-fg);position:relative} .rail .it.on{background:var(--card);color:var(--primary);border:var(--hair) solid var(--rail-border)} .rail .sp{margin-top:auto}
.main{flex:1;min-width:0;display:flex;position:relative;overflow:hidden}
.screen{flex:1;display:flex;min-width:0} .frame[data-w="phone"] .screen{flex-direction:column}

.sidewrap{position:absolute;inset:0;z-index:20;background:var(--scrim);display:flex}
.sidewrap.right{justify-content:flex-end}
.sidepanel{position:relative;height:100%;width:min(100%,400px);background:var(--card);border-right:var(--hair) solid var(--border);display:flex;flex-direction:column;animation:slidel 220ms var(--ease)}
.sidewrap.right .sidepanel{border-right:0;border-left:var(--hair) solid var(--border);animation:slide 220ms var(--ease)}
.frame[data-w="phone"] .sidewrap{align-items:flex-end} .frame[data-w="phone"] .sidepanel{width:100%;height:auto;max-height:92%;border:0;border-top:var(--hair) solid var(--border);border-radius:calc(var(--r)*2) calc(var(--r)*2) 0 0;animation:rise 200ms var(--ease)}
.sidepanel .ft{display:flex;gap:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*4);border-top:var(--hair) solid var(--border)}
@keyframes slidel{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.sidepanel .h{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*4);font-weight:600;border-bottom:var(--hair) solid var(--border)}
.sidepanel .bd{flex:1;overflow:auto;padding:calc(var(--u)*2)}
.sidepanel .bd.form{padding:calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.upstrip{display:flex;align-items:center;gap:calc(var(--u)*2.5);padding:0 calc(var(--u)*2) 0 calc(var(--u)*4);min-height:40px;background:var(--warn-bg);color:var(--fg);border-bottom:var(--hair) solid color-mix(in oklch,var(--warn) 45%,transparent);flex:none;font-size:calc(var(--fs)*.93)} .upstrip.bottom{border-bottom:0;border-top:var(--hair) solid color-mix(in oklch,var(--warn) 45%,transparent)}
.upstrip>svg{width:16px;height:16px;flex:none;color:var(--warn)} .upstrip .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .upstrip .msg b{font-weight:600} .upstrip .act{height:28px;padding:0 calc(var(--u)*2.5);border-radius:var(--r);background:var(--primary);color:var(--primary-fg);font-weight:600;font-size:calc(var(--fs)*.9);white-space:nowrap} .upstrip .more{color:var(--muted-fg);white-space:nowrap;text-decoration:underline;text-underline-offset:2px}
.frame[data-w="phone"] .upstrip .more{display:none}
.upstrip .x{width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted-fg);flex:none;margin-left:calc(var(--u)*-1)} .upstrip .x svg{width:16px;height:16px} .upstrip .x:active{background:color-mix(in oklch,var(--warn) 20%,transparent)}
.ibtn{position:relative} .ndot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--card)}
/* Paul 2026-09-17: the update notice lives in the bell; the bell opens a side panel */
.sidepanel .bd.notif{padding:0} .ngrp{padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*1.5);font-size:calc(var(--fs)*.78);font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg)}
.nitem{display:flex;gap:calc(var(--u)*3);padding:calc(var(--u)*3) calc(var(--u)*4);border-bottom:var(--hair) solid var(--border);width:100%;text-align:left;align-items:flex-start} .nitem .ic{width:32px;height:32px;border-radius:50%;background:var(--muted);color:var(--muted-fg);display:grid;place-items:center;flex:none} .nitem .ic svg{width:16px;height:16px} .nitem .ic.ok{background:var(--ok-bg);color:var(--ok)} .nitem .ic.warn{background:var(--warn-bg);color:var(--warn)} .nitem .ic.upd{background:var(--primary);color:var(--primary-fg)}
.nitem .tx{flex:1;min-width:0} .nitem .t{font-weight:500} .nitem .s{color:var(--muted-fg);font-size:calc(var(--fs)*.9);margin-top:2px} .nitem .when{color:var(--muted-fg);font-size:calc(var(--fs)*.8);flex:none;margin-top:2px} .nitem .udot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;margin-top:6px}
.nitem.upd{background:color-mix(in oklch,var(--primary) 6%,var(--card));border-bottom-color:color-mix(in oklch,var(--primary) 25%,transparent)} .nitem.upd .acts{display:flex;gap:calc(var(--u)*2);margin-top:calc(var(--u)*2.5)} .nitem.upd .acts .btn{height:32px;padding:0 calc(var(--u)*3)}
.bar{height:max(var(--ctl),var(--floor));display:flex;align-items:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*2) 0 calc(var(--u)*4);border-bottom:var(--hair) solid var(--border);flex:none}
.bar .place{font-weight:600;display:inline-flex;align-items:center;gap:calc(var(--u)*2)}
.bar .avbtn{width:max(var(--ctl),var(--floor));height:max(var(--ctl),var(--floor));display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r)} .bar .avbtn:active{background:var(--muted)}
.av{width:calc(var(--ctl) - 14px);height:calc(var(--ctl) - 14px);border-radius:50%;background:var(--muted);color:var(--fg);font-size:calc(var(--fs)*.8);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
/* ---- sheets ---- */
.sheet-wrap{position:absolute;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*6)} .frame[data-w="phone"] .sheet-wrap{align-items:flex-end;padding:0}

.sheet-h{display:flex;align-items:flex-start;gap:calc(var(--u)*2);padding:calc(var(--u)*4) calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*4)} .sheet-h .t{font-size:calc(var(--fs)*1.2);font-weight:700}
.sheet-b{padding:0 calc(var(--u)*4) calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*3);overflow:auto} .sheet-f{display:flex;justify-content:flex-end;gap:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*4);border-top:var(--hair) solid var(--border)}
.sheet-context{margin-top:calc(var(--u)*2);font-weight:400;color:var(--muted-fg)}
.fold{border-top:var(--hair) solid var(--border)} .fold>button{width:100%;display:flex;align-items:center;gap:calc(var(--u)*2);height:max(var(--row),var(--floor));color:var(--muted-fg);text-align:left}

/* ============================ period model ============================ */
function dayTotal(off) {
  if (off === 0) return sum(ORDERS, o => o.total);
  if (DAYTOTAL_OVERRIDE[off] != null) return DAYTOTAL_OVERRIDE[off];
  return r2(640 + DP[wdOf(off)] * 7 * 300 + h01('d' + off) * 380);
}
function hourly(off, list) { // array over HOURS
  if (list) { const a = HOURS.map(() => 0); list.forEach(o => { const i = HOURS.indexOf(o.hour); if (i >= 0) a[i] += o.total; }); return a; }
  const t = dayTotal(off); return P.map(p => r2(t * p));
}
function monthDays(off) { // days of the month `off` months back: [{off, d}]
  const first = new Date(TODAY.getFullYear(), TODAY.getMonth() - off, 1);
  const n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const out = []; for (let d = 1; d <= n; d++) { const dt = new Date(first.getFullYear(), first.getMonth(), d); out.push({ d, off: Math.round((TODAY - dt) / 86400000) }); }
  return out;
}
// buckets: [{label, off, cur:bool (has happened), val}]
function buckets(gran, off) {
  if (gran === 'day') return HOURS.map(h => ({ label: h === 12 ? '12pm' : h > 12 ? (h - 12) + 'pm' : h + 'am', hour: h, past: off > 0 || h <= NOWH }));
  if (gran === 'week') return WD.map((w, i) => ({ label: w, off: off * 7 - i, past: off * 7 - i >= 0 }));
  if (gran === 'month') return monthDays(off).map(x => ({ label: String(x.d), off: x.off, past: x.off >= 0 }));
  const n = S.cFrom - S.cTo + 1, out = [];
  for (let i = 0; i < n; i++) { const o = S.cFrom - i + off * n; out.push({ label: String(dateOf(o).getDate()), off: o, past: o >= 0 }); }
  return out;
}
function periodTitle(gran, off) {
  const m3 = d => MON[d.getMonth()].slice(0, 3);
  if (gran === 'day') return off === 0 ? 'Today' : off === 1 ? 'Yesterday' : `${WDL[wdOf(off)]} ${dateOf(off).getDate()} ${m3(dateOf(off))}`;
  if (gran === 'week') return off === 0 ? 'This week' : off === 1 ? 'Last week' : `Week of ${dateOf(off * 7).getDate()} ${m3(dateOf(off * 7))}`;
  if (gran === 'month') { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - off, 1); return off === 0 ? 'This month' : off === 1 ? 'Last month' : MON[d.getMonth()]; }
  const b = buckets('custom', off), a = dateOf(b[0].off), z = dateOf(b[b.length - 1].off);
  return a.getMonth() === z.getMonth() ? `${a.getDate()}–${z.getDate()} ${m3(z)}` : `${a.getDate()} ${m3(a)} – ${z.getDate()} ${m3(z)}`;
}
const CMP_OFF = { lastweek: 7, yesterday: 1, lastyear: 364 };
const CMP_LABEL = { lastweek: 'same day last week', yesterday: 'the day before', lastyear: 'same day last year' };
function refLabel() {
  if (S.gran === 'day') return S.off === 0 ? { lastweek: `last ${WDL[0]}`, yesterday: 'yesterday', lastyear: 'a year ago' }[S.cmp] : CMP_LABEL[S.cmp];
  if (S.gran === 'week') return 'the week before';
  if (S.gran === 'month') return `${MON[(TODAY.getMonth() - S.off - 1 + 12) % 12]}`;
  return `the ${S.cFrom - S.cTo + 1} days before`;
}
/* orders in the period (today = real; anything else = synthetic, shaped like today) */
const ORD_CACHE = {};
function ordersFor(gran, off) {
  const key = gran + ':' + off + (gran === 'custom' ? ':' + S.cFrom + ':' + S.cTo : '');
  if (ORD_CACHE[key]) return ORD_CACHE[key];
  let list;
  if (gran === 'day' && off === 0) list = ORDERS.map(o => ({ ...o, key: 'day:0:' + o.n }));
  else {
    const raw = gran === 'day' ? dayTotal(off) : sum(buckets(gran, off).filter(b => b.past), b => dayTotal(b.off));
    const n = Math.max(3, Math.round(raw / 88.6));
    list = []; let acc = 0;
    for (let i = 0; i < n; i++) { const b = ORDERS[i % ORDERS.length]; const w = b.total * (0.7 + h01(key + i) * 0.6); list.push({ ...b, n: 1226 - (off * 40 + i), w, key: key + ':' + i }); acc += w; }
    const k = raw / acc; list.forEach(o => { o.total = r2(o.w * k); o.tax = r2(o.total / 6); delete o.w; });
    if (gran === 'day') list.forEach((o, i) => { o.hour = HOURS[Math.min(11, 1 + Math.floor(i * 11 / n))]; o.time = String(o.hour).padStart(2, '0') + ':' + String(Math.floor(h01('t' + o.key) * 60)).padStart(2, '0'); });
    list.sort((a, b) => a.time < b.time ? -1 : 1);
  }
  if (S.cashier !== 'all') list = list.filter(o => o.cashier === S.cashier);
  return ORD_CACHE[key] = list;
}
const ticked = list => list.filter(o => !S.unticked.has(o.key));

function model() {
  const all = ordersFor(S.gran, S.off), t = ticked(all);
  const rawAll = sum(all, o => o.total), total = sum(t, o => o.total), scale = rawAll ? total / rawAll : 1;
  const bk = buckets(S.gran, S.off);
  let cur, prev, prevRef, prevTotal;
  if (S.gran === 'day') {
    cur = hourly(S.off, t);
    prev = hourly(S.off + CMP_OFF[S.cmp]);
    prevTotal = sum(prev);
    prevRef = S.off === 0 ? sum(prev.filter((_, i) => HOURS[i] <= NOWH)) : prevTotal;
  } else {
    cur = bk.map(b => b.past ? r2(dayTotal(b.off) * scale) : 0);
    const pb = buckets(S.gran, S.off + 1);
    prev = bk.map((b, i) => pb[i] ? dayTotal(pb[i].off) : 0);
    prevTotal = sum(prev);
    prevRef = S.off === 0 ? sum(prev.filter((_, i) => bk[i].past)) : prevTotal;
  }
  const orders = t.length, prevOrders = Math.max(1, Math.round(prevRef / 88.6));
  const items = sum(t, o => o.items), prevItems = Math.round(prevOrders * 2.2);
  // busiest bucket
  let bi = 0; cur.forEach((v, i) => { if (v > cur[bi]) bi = i; });
  const busiest = cur[bi] > 0 ? { label: S.gran === 'day' ? bk[bi].label.replace('am', ' am').replace('pm', ' pm') : (S.gran === 'week' ? WDL[bi] : `the ${bk[bi].label}${['th','st','nd','rd'][(bk[bi].label % 10 < 4 && ![11,12,13].includes(+bk[bi].label)) ? bk[bi].label % 10 : 0]}`), val: cur[bi], n: S.gran === 'day' ? t.filter(o => o.hour === bk[bi].hour).length : null } : null;
  const by = (f) => { const m = {}; t.forEach(o => { m[f(o)] = (m[f(o)] || 0) + o.total; }); return m; };
  const cnt = (f) => { const m = {}; t.forEach(o => { m[f(o)] = (m[f(o)] || 0) + 1; }); return m; };
  return { all, t, total, scale, bk, cur, prev, prevRef, prevTotal, orders, prevOrders, items, prevItems, busiest,
    byMethod: by(o => o.method), cntMethod: cnt(o => o.method), byChannel: by(o => o.channel), cntChannel: cnt(o => o.channel),
    byCashier: by(o => o.cashier), cntCashier: cnt(o => o.cashier), tax: sum(t, o => o.tax), excluded: all.length - t.length };
}

  const tabs=`<span class="segt" role="tablist" aria-label="Report room">${['sales','closures'].map(v=>`<button role="tab" aria-selected="${S.view===v}" class="${S.view===v?'on':''}" data-act="view" data-v="${v}">${v==='sales'?'Sales':'Closures'}</button>`).join('')}</span>`;
  return `<div class="bar">${phone?`<button class="ibtn press" data-act="openSheet" data-sheet="menu" aria-label="Menu" style="margin-left:calc(var(--u)*-3)">${I.menu}</button>`:''}<span class="place">Reports</span>${phone?'':tabs}${S.online?'':status('warn','Offline')}<span class="grow"></span><button class="ibtn press" data-act="openSheet" data-sheet="notif" aria-label="Notifications" title="Notifications">${I.bell}${S.upd==='ready'?'<span class="ndot"></span>':''}</button>${phone?`<button class="avbtn press" data-act="openSheet" data-sheet="user" aria-label="Demo Cashier"><span class="av">DC</span></button>`:''}</div>${phone?`<div class="phone-tabs">${tabs}</div>`:''}`;
}
function scopeRow(){return `<div class="scope-row">${periodBar()}<span class="grow"></span><button class="chip press" data-act="pop" data-p="scope">${esc(regName())} · ${esc(STORES.find(x=>x.id===S.store).name)}${S.pro?'':I.lock}${I.chevd}</button><button class="chip press ${S.cashier!=='all'||S.status!=='done'?'on':''}" data-act="pop" data-p="filter">${I.sliders}${S.cashier==='all'?'Filter':esc(S.cashier)}${S.status==='all'?' · Every status':''}${I.chevd}</button>${S.view==='closures'?`<button class="ibtn press" aria-label="More" data-act="pop" data-p="overflow">${I.dots}</button>`:''}</div>`;}
const status=(kind,label)=>`<span class="st ${kind}"><i></i>${label}</span>`;

function panelTitle() {
  if (S.xreport) return 'X-report';
  if (S.closure) { const c = CLOSURES.find(c => c.id === S.closure); return `${c.dayLabel} ${c.open}–${c.close}`; }
  return { summary: 'Sales summary', payments: 'Sales by payment method', channels: 'In store and online', products: 'Top products', categories: 'Sales by category', cashiers: 'Sales by cashier', registers: 'Sales by register', taxes: 'Taxes collected', orders: 'Orders', refunds: 'Refunds and discounts', cash: 'Cash movements', deposits: 'Deposits' }[S.detail] || '';
}

/* ---- Sales room ---- */
function sales() {
  const m = model();
  return `<div class="pad">${hero(m)}${tiles(m)}</div>`;
}
function periodBar() {
  return `<div class="pbar"><button class="ibtn press" data-act="step" data-v="1" title="Earlier">${I.left}</button><button class="datebtn" data-act="pop" data-p="date">${esc(periodTitle(S.gran, S.off))}${!S.pro ? `<span class="lk">${I.lock}</span>` : ''}<span class="car">${I.car}</span></button><button class="ibtn press" data-act="step" data-v="-1" ${S.off === 0 ? 'disabled' : ''} title="Later">${I.right}</button>${S.gran === 'custom' ? `<span class="mut sm">${S.cFrom - S.cTo + 1} days</span>` : ''}</div>`;
}
function deltaChip(cur, prev) {
  if (!prev) return '';
  const d = (cur - prev) / prev, a = Math.abs(d) * 100;
  const cls = a < 0.5 ? 'flat' : d > 0 ? 'up' : 'down';
  return `<span class="delta ${cls}">${cls === 'flat' ? '0' : (cls === 'up' ? '+' : '−') + (a < 10 ? a.toFixed(1) : Math.round(a))}%</span>`;
}
function hero(m) {
  const prevLine = S.gran === 'day' && S.off === 0 ? `${fmt(m.prevRef)} by now ${refLabel()}` : S.gran !== 'day' && S.off === 0 ? `${fmt(m.prevRef)} at this point ${refLabel()}` : `${fmt(m.prevRef)} ${refLabel()}`;
  const cmpBtn = S.gran === 'day' ? `<button class="cmpbtn" data-act="pop" data-p="cmp">vs ${esc(CMP_LABEL[S.cmp])}<span class="car">${I.car}</span></button>` : `<span class="mut sm" style="height:30px;display:inline-flex;align-items:center">vs ${esc(refLabel())}</span>`;
  const kp = (l, n, p) => `<div class="kpi"><div class="l">${l}</div><div class="n">${n}</div><div class="p">${p}</div></div>`;
  const avg = m.orders ? m.total / m.orders : 0, pavg = m.prevOrders ? m.prevRef / m.prevOrders : 0;
  return `<div class="card hero">
    <button class="ibtn press printb" data-act="detail" data-v="summary" title="Sales summary">${I.print}</button>
    <div class="hero-top">
      <div>
        <div class="lbl">Sales</div>
        <div class="big">${fmt(m.total)}</div>
        <div class="prev">${deltaChip(m.total, m.prevRef)}<span>${prevLine}</span>${m.excluded ? `<button class="chip press" data-act="resetTicks" title="Put them back">${m.excluded} order${m.excluded > 1 ? 's' : ''} left out${I.x}</button>` : ''}</div>
        <div style="margin-top:4px">${cmpBtn}</div>
      </div>
      <div class="kpis">${kp('Orders', m.orders, m.prevOrders + ' ' + (S.off === 0 ? 'by now' : 'before'))}${kp('Average order', fmt(avg), fmt(pavg))}${kp('Items', m.items, m.prevItems)}</div>
    </div>
    ${chart(m)}
  </div>`;
}
function chart(m) {
  const W = phone() ? 340 : 1090, H = phone() ? 130 : 140, padB = 20, top = 8;
  const n = m.bk.length, gap = n > 14 ? 3 : 8, step = W / n, bw = Math.min(40, step - gap);
  const max = Math.max(1, ...m.cur, ...m.prev);
  const y = v => top + (H - padB - top) * (1 - v / max);
  const every = S.gran === 'month' || S.gran === 'custom' ? (n > 14 ? 7 : phone() ? 2 : 1) : (phone() && S.gran === 'day' ? 2 : 1);
  let s = `<svg class="bars" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  m.bk.forEach((b, i) => {
    const x = (i + .5) * step - bw / 2;
    const pv = m.prev[i], cv = m.cur[i];
    if (pv > 0) s += `<rect class="ghost-bar ${b.past?'':'future'}" x="${x}" y="${y(pv)}" width="${bw}" height="${H - padB - y(pv)}" rx="2" fill="var(--border)"/>`;
    if (cv > 0) s += `<rect x="${x}" y="${y(cv)}" width="${bw}" height="${H - padB - y(cv)}" rx="2" fill="var(--primary)"/>`;
    s += `<rect class="hit" data-i="${i}" x="${i * step}" y="0" width="${step}" height="${H}" fill="transparent"/>`;
    if (i % every === 0) s += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--muted-fg)">${b.label}</text>`;
  });
  s += `</svg>`;
  const tip = S.tip != null ? (() => { const i = S.tip; const b = m.bk[i]; return `<div class="tip" style="left:${(i + .5) * step / W * 100}%;top:0"><b>${fmt(m.cur[i])}</b> · ${fmt(m.prev[i])} ${esc(refLabel())}</div>`; })() : '';
  const busy = m.busiest ? (S.gran === 'day' ? `Busiest hour <b>${esc(m.busiest.label)}</b>, ${fmt(m.busiest.val)} from ${m.busiest.n} order${m.busiest.n === 1 ? '' : 's'}` : `Best day <b>${esc(m.busiest.label)}</b>, ${fmt(m.busiest.val)}`) : 'Nothing sold yet';
  return `<div class="chart" data-unit="${S.gran}" style="position:relative">${tip}${s}<div class="cap"><span>${busy}</span><span class="lg" style="margin-left:auto"><i style="background:var(--primary)"></i>${esc(periodTitle(S.gran, S.off))}</span><span class="lg"><i style="background:var(--border)"></i>${esc(refLabel())}</span></div></div>`;
}
function tiles(m) {
  const T=m.total, top=Object.entries(m.byCashier).sort((a,b)=>b[1]-a[1])[0];
  const rows=[['payments','Payments',fmt(m.byMethod.Card||0),'Card · Cash '+fmt(m.byMethod.Cash||0)],['channels','In store · Online',fmt(m.byChannel['In store']||0),'Online '+fmt(m.byChannel.Online||0)],['products','Top products',fmt(T*.16),'Oat flat white'],['cashiers','Cashiers',fmt(top?.[1]||0),top?.[0]||'No sales'],...(S.register==='all'?[['registers','Registers',fmt(T*.86),'Front till · 86%']]:[]),['categories','Categories',fmt(T*.41),'Coffee'],['taxes','Taxes',fmt(m.tax),'VAT 20% · VAT 5%'],['orders','Orders',m.orders,'Largest '+fmt(m.t.length?Math.max(...m.t.map(o=>o.total)):0)],['refunds','Refunds · Discounts',fmt(0),'Discounts '+fmt(T*.011)],['cash','Cash movements',fmt(150)+' out','To bank at 15:40'],['deposits','Deposits',S.online?fmt(T*.08):'Unavailable offline',S.online?Math.max(1,Math.round(m.orders/6))+' deposits taken':'Comes from the server']];
  return `<div class="tiles">${rows.map(([k,l,n,line])=>`<button class="tile press" data-act="detail" data-v="${k}" ${k==='deposits'&&!S.online?'disabled':''}><span class="l">${l}${I.chev}</span><span class="n">${n}</span><span class="line">${line}</span></button>`).join('')}</div>`;
}

function closureRows(){
  const days=S.gran==='day'?[S.off]:buckets(S.gran,S.off).filter(b=>b.past).map(b=>b.off);
  return CLOSURES.filter(c=>(S.register==='all'||c.reg===regName())&&(S.cashier==='all'||c.by===S.cashier)&&(!S.pro||days.includes(c.day)));
}
function closures() {
  const sessionCard=reg=>{
    const last=CLOSURES.find(c=>c.reg===reg.name), open=reg.id==='front'&&S.regOpen;
    return `<div class="card sess"><div><div class="row b">${esc(reg.name)} · ${status(open?'ok':'neutral',open?'Open':'Register closed')}</div>${open?`<div class="who">Opened at ${OPEN_SESSION.open} by ${OPEN_SESSION.by}</div><div class="big money" data-testid="session-expected">Expected ${fmt(OPEN_SESSION.expected)}</div><div class="who">6 sales</div>`:`<div class="who">Closure ${last.num} · closed at ${last.close} by ${last.by}</div><div class="big money">${fmt(last.counted)}</div>`}</div><button class="btn press" data-testid="${open?'session-print':'session-reprint'}" data-act="${open?'xreport':'reprint'}" data-v="${last.id}">${I.print}${open?'Print X-report':'Reprint'}</button></div>`;
  };
  const session=REGISTERS.filter(r=>S.register==='all'||r.id===S.register).map(sessionCard).join('');
  if(S.empty) return `<div class="pad"><div class="empty" data-testid="closures-empty"><b>No closures yet</b><span class="mut">Closures appear here after you close a register.</span></div></div>`;
  const rows=closureRows(); let day=null;
  const content=rows.map(c=>{const locked=!S.pro&&c.day>0, result=status(c.variance?'warn':'ok',c.variance?fmt(Math.abs(c.variance))+(c.variance<0?' short':' over'):'Exact');
    const badge=c.unsynced?status('warn','Unsynced'):c.corrected?status('info','Corrected'):'';
    const group=day!==c.dayLabel?(day=c.dayLabel,S.w==='desktop'?`<tr class="grp"><td class="g" colspan="5">${c.dayLabel}</td></tr>`:`<div class="day-group">${c.dayLabel}</div>`):'';
    const attrs=`data-id="${c.id}" data-act="${locked?'hint':'closure'}" data-v="${locked?'closures':c.id}"`;
    return group+(S.w==='desktop'?`<tr class="click ${locked?'lock':''}" ${attrs} tabindex="0" role="button"><td>Closure ${c.num}${locked?I.lock:''}<div>${badge}</div></td><td>${c.reg}</td><td>${c.by}<div class="mut xs">${c.open} → ${c.close}</div></td><td>${fmt(c.counted)}</td><td>${result}</td></tr>`:`<button class="closure-row press ${locked?'lock':''}" ${attrs}><span class="grow"><span>Closure ${c.num} · ${c.reg}</span><span class="mut">${c.open} → ${c.close} · ${c.by}</span>${badge}</span><span class="result"><span>${fmt(c.counted)}</span>${result}</span>${locked?I.lock:I.chev}</button>`);
  }).join('');
  return `<div class="pad">${session}${S.w==='desktop'?`<table class="closures-list"><thead><tr><th>Closure</th><th>Register</th><th>Closed by</th><th>Counted</th><th>Drawer result</th></tr></thead><tbody>${content}</tbody></table>`:content}<div class="tfoot">${rows.length} of ${rows.length}</div></div>`;
}

function panel() {
  if (!S.detail && !S.closure && !S.xreport) return '';
  const tplSel=type=>`<label class="template-label"><span class="sm mut">Template</span><select id="template" title="Managed in WP Admin › POS › Templates. A template formats the report; it cannot add data." data-type="${type}" aria-label="Template">${TEMPLATES[type].map(t=>`<option value="${t.id}" ${S.tpl===t.id?'selected':''}>${t.name} (${t.s})</option>`).join('')}</select></label>`;
  const tplName = type => (TEMPLATES[type].find(t => t.id === S.tpl) || TEMPLATES[type][0]).name;
  if (S.closure || S.xreport) {
    const c = S.xreport ? null : CLOSURES.find(c => c.id === S.closure);
    const sub=S.xreport?`${OPEN_SESSION.reg} · opened at ${OPEN_SESSION.open} by ${OPEN_SESSION.by}`:`${c.reg} · closed by ${c.by} · ${c.dayLabel} ${c.close}`;
    const disabled=!S.online||c?.unsynced||S.error;
    const foot=S.xreport?`<span class="status">Interim. Figures keep moving until the register is closed.</span><button class="btn p press" data-act="print">${I.print}Print</button>`:`<span class="status">${!S.online?'Connect to recount':c.unsynced?'Sync this closure before recounting':(phone()?'Recorded ':'As recorded at ')+c.close}</span><button class="btn press" data-act="recount" ${disabled?'disabled':''}>Recount…</button><button class="btn p press" data-act="print" ${S.error?'disabled':''}>${I.print}Reprint</button>`;
    const body=S.error?`<div class="empty"><span data-testid="closure-document-error">Could not load reports.</span><button class="btn press" data-act="retry">Retry</button></div>`:closureDoc(c);
    return wrapPanel(S.xreport?'X-report':'Closure '+c.num,sub,tplSel('closure'),body,foot);
  }

  const m = model();
  const title = panelTitle(), sub = `${periodTitle(S.gran, S.off)} · ${regName()}`;
  const T = m.total || 1, avg = m.orders ? m.total / m.orders : 0, t20 = r2(m.tax * .958), t5 = r2(m.tax - t20);
  let spec;
  switch (S.detail) {
    case 'summary': spec = { head: ['', ''], nohead: true, rows: ['Sales', ['Gross sales', fmt(m.total)], ['Refunds', fmt(0)], ['Discounts', fmt(r2(T * .011))], ['Net sales', fmt(m.total)], ['Orders', m.orders], ['Average order', fmt(avg)], ['Items sold', m.items], 'Payments', ...Object.keys(m.byMethod).sort((a, b) => m.byMethod[b] - m.byMethod[a]).map(k => [k, fmt(m.byMethod[k])]), 'Taxes', ['VAT 20%', fmt(t20)], ['VAT 5%', fmt(t5)], ['Sales net of tax', fmt(m.total - m.tax)]] }; break;
    case 'payments': { const ks = Object.keys(m.byMethod).sort((a, b) => m.byMethod[b] - m.byMethod[a]); spec = { head: ['Method', 'Orders', 'Amount', 'Share'], rows: ks.map(k => [k, m.cntMethod[k], fmt(m.byMethod[k]), pct(m.byMethod[k] / T)]), tot: ['Total', m.orders, fmt(m.total), ''] }; break; }
    case 'channels': { const ks = ['In store', 'Online'].filter(k => m.byChannel[k]); spec = { head: ['Channel', 'Orders', 'Amount', 'Share'], rows: ks.map(k => [k, m.cntChannel[k], fmt(m.byChannel[k]), pct(m.byChannel[k] / T)]), tot: ['Total', m.orders, fmt(m.total), ''] }; break; }
    case 'products': spec = { head: ['Product', 'Qty', 'Amount'], rows: PRODUCTS.map(([n, s]) => [esc(n), Math.max(1, Math.round(m.items * s * 1.1)), fmt(r2(T * s))]), tot: ['All products', m.items, fmt(m.total)] }; break;
    case 'categories': spec = { head: ['Category', 'Qty', 'Amount', 'Share'], rows: [['Coffee', .41], ['Bakery', .29], ['Retail', .18], ['Uncategorised', .12]].map(([n, s]) => [n, Math.max(1, Math.round(m.items * s)), fmt(r2(T * s)), pct(s)]), tot: ['Total', m.items, fmt(m.total), ''] }; break;
    case 'cashiers': { const ks = Object.keys(m.byCashier).sort((a, b) => m.byCashier[b] - m.byCashier[a]); spec = { head: ['Cashier', 'Orders', 'Avg order', 'Amount'], rows: ks.map(k => [`<span class="avi">${k[0]}</span>${k}`, m.cntCashier[k], fmt(m.byCashier[k] / m.cntCashier[k]), fmt(m.byCashier[k])]), tot: ['Total', m.orders, fmt(avg), fmt(m.total)] }; break; }
    case 'registers': spec = { head: ['Register', 'Orders', 'Amount', 'Share'], rows: [['Front till', Math.round(m.orders * .86), fmt(r2(T * .86)), '86%'], ['Back office', m.orders - Math.round(m.orders * .86), fmt(r2(T * .14)), '14%']], tot: ['Total', m.orders, fmt(m.total), ''] }; break;
    case 'taxes': spec = { head: ['Rate', 'Net', 'Tax', 'Gross'], rows: [['VAT 20%', fmt(t20 * 5), fmt(t20), fmt(t20 * 6)], ['VAT 5%', fmt(t5 * 20), fmt(t5), fmt(t5 * 21)]], tot: ['Total', fmt(m.total - m.tax), fmt(m.tax), fmt(m.total)] }; break;
    case 'refunds': spec = { head: ['Kind', 'Count', 'Amount'], rows: [['Refunds', 0, fmt(0)], ['Discounts', Math.max(1, Math.round(m.orders / 5)), fmt(r2(T * .011))], ['Voided', 0, fmt(0)]] }; break;
    case 'cash': spec = { head: ['Time', 'Movement', 'By', 'Amount'], rows: MOVEMENTS.map(x => [x.time, `${x.kind} <div class="xs mut">${x.note}</div>`, x.by, fmt(x.amt)]), tot: ['Net', '', '', fmt(sum(MOVEMENTS, x => x.amt))] }; break;
    case 'deposits': spec = S.online ? { head: ['Deposit', 'Order', 'Amount', 'Status'], rows: m.t.slice(0, Math.max(1, Math.round(m.orders / 6))).map((o, i) => [`DEP-${o.n}`, `#${o.n}`, fmt(r2(o.total * .5)), i === 0 ? 'Released' : 'Held']), note: `<div class="mut sm" style="padding:10px 12px">From the Deposits plugin. Computed on the server, so it needs a connection.</div>` } : null; break;
    case 'orders': spec = { head: ['Order', 'Paid by', 'Total'], rows: m.all.slice(0, 60).map(o => Object.assign([`#${o.n} <div class="xs mut">${o.time} · ${o.cashier}</div>`, o.method, fmt(o.total)], { key: o.key, number: o.n, meta: `${o.time} · ${o.cashier}`, off: S.unticked.has(o.key) })), orders: true, excluded: m.excluded, anyOff: !!m.excluded, tot: ['Counted', '', fmt(m.total)], note: m.all.length > 60 ? `<div class="mut sm" style="padding:10px 12px">and ${m.all.length - 60} more</div>` : '' }; break;
  }
  S.spec=spec;
  const body = spec ? renderSpec(spec, title, sub) : `<div class="mut" style="padding:24px 16px">Report unavailable offline.</div>`;
  const status = S.detail === 'orders' ? `${m.orders} of ${m.all.length} counted${m.excluded ? ' · the numbers follow' : ''}` : `${m.orders} orders · ${fmt(m.total)}`;
  const foot = `<span class="status">${status}</span><button class="btn" data-act="export">Export CSV</button><button class="btn p" data-act="print">${I.print}Print</button>`;
  return wrapPanel(title, sub, tplSel('report'), body, foot);
}
function renderSpec(spec, title, sub) {
  const withCb = !!spec.orders && S.tpl === 'default';
  const rows = withCb ? spec.rows : spec.rows.filter(r => typeof r === 'string' || !r.off);
  if (S.tpl === 'thermal') {
    const w = 40, cols = spec.head.length, cw = cols <= 3 ? 11 : 8, fw = w - cw * (cols - 1);
    const line = r => typeof r === 'string' ? '\n' + r : (() => { const c = r.map(x => String(x).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()); return c[0].slice(0, fw - 1).padEnd(fw) + c.slice(1).map(x => x.padStart(cw)).join(''); })();
    return `<div class="docv thermal">${esc(['      UK Store', title, sub, '', ...(spec.nohead ? [] : [spec.head.map((h, i) => i ? h.padStart(cw) : h.padEnd(fw)).join(''), '-'.repeat(w)]), ...rows.map(line), ...(spec.tot ? ['-'.repeat(w), line(spec.tot)] : [])].join('\n'))}</div>`;
  }
  const tbl = tblSpec({ ...spec, rows }, withCb);
  if (S.tpl === 'default') return tbl + (spec.note || '');
  return `<div class="docv a4"><div class="brand"><i></i><b>UK Store</b><span class="mut sm" style="margin-left:auto">${S.tpl === 'handover' ? 'Weekend handover' : 'Sales sheet'}</span></div><div class="dh"><div><div class="t">${esc(title)}</div><div class="mut sm">${esc(sub)}</div></div></div>${tbl}${S.tpl === 'handover' ? '<div class="sec">Notes for Monday</div><div class="dr"><span class="mut">&nbsp;</span></div><div class="dr"><span class="mut">&nbsp;</span></div>' : ''}</div>`;
}
function tblSpec(spec, withCb) {
  if(withCb)return `<div class="orders-list"><div class="orders-head"><label><span class="checkcell"><input aria-label="Include all orders" type="checkbox" data-act="tickAll" ${spec.anyOff?'':'checked'}></span>All orders</label>${spec.excluded?`<span class="orders-left-out">${spec.excluded} order${spec.excluded===1?'':'s'} left out</span>`:''}</div>${spec.rows.map(r=>`<div class="order-row ${r.off?'off':''}"><label class="checkcell"><input aria-label="Include order #${r.number}" type="checkbox" data-act="tick" data-k="${r.key}" ${r.off?'':'checked'}></label><div class="order-data"><span>#${r.number}</span><span class="order-meta mut">${r.meta}</span><span class="mut">${r[1]}</span><span class="order-total">${r[2]}</span></div></div>`).join('')}<div class="dr b"><span>Counted</span><span>${spec.tot[2]}</span></div></div>`;
  const n = spec.head.length + (withCb ? 1 : 0);
  if(S.w!=='desktop'&&S.tpl==='default')return `<div class="touch-report">${withCb?`<label class="checkcell row"><input aria-label="Include all orders" type="checkbox" data-act="tickAll" ${spec.anyOff?'':'checked'}>Include all orders</label>`:''}${spec.rows.map(r=>typeof r==='string'?`<div class="sec">${r}</div>`:`<div class="report-row ${r.off?'off':''}">${withCb?`<label class="checkcell"><input aria-label="Include order ${r[0].split(' ')[0]}" type="checkbox" data-act="tick" data-k="${r.key}" ${r.off?'':'checked'}></label>`:''}<div class="grow"><div class="b">${r[0]}</div>${r.slice(1).map((c,i)=>`<div class="dr"><span class="mut">${spec.head[i+1]}</span><span>${c}</span></div>`).join('')}</div></div>`).join('')}${spec.tot?`<div class="dr b">${spec.tot.filter(Boolean).map(c=>`<span>${c}</span>`).join('')}</div>`:''}</div>`;
  const cell = (c, i, tag = 'td') => `<${tag} class="${i ? 'r' : ''}">${c}</${tag}>`;
  const rowH = r => typeof r === 'string' ? `<tr class="grp"><td class="g" colspan="${n}">${r}</td></tr>` : `<tr class="${r.off ? 'off' : ''}">${withCb ? `<td style="width:36px"><label class="checkcell"><input aria-label="Include order" type="checkbox" data-act="tick" data-k="${r.key}" ${r.off ? '' : 'checked'}></label></td>` : ''}${r.map((c, i) => cell(c, i)).join('')}</tr>`;

  } else if (p.kind === 'tpl') {

F.addEventListener('click', e => {
  const hit = e.target.closest('rect.hit');

  const el = e.target.closest('[data-act]'); if (!el) return;

  const a = el.dataset.act, v = el.dataset.v;
  const anchor = el;
  if(['pop','detail','closure','xreport','openSheet'].includes(a))S.returnFocus=`[data-act="${a}"]${v?'[data-v="'+v+'"]':''}${el.dataset.p?'[data-p="'+el.dataset.p+'"]':''}${el.dataset.sheet?'[data-sheet="'+el.dataset.sheet+'"]':''}`;
  switch (a) {
    case 'openSheet': S.sheet=el.dataset.sheet; break;

    case 'recount': S.sheet='recount'; S.reason=''; S.counted=''; S.pieces={}; S.denominations=false; break;
    case 'denominations': S.denominations=!S.denominations; break;
    case 'denomination': S.pieces[v]=(S.pieces[v]||0)+1; S.counted=sum(Object.entries(S.pieces),([v,n])=>+v*n).toFixed(2); break;
    case 'saveRecount': { if(!S.online||!S.reason.trim()||S.counted===''||!Number.isFinite(+S.counted)||+S.counted<0)return; const c=CLOSURES.find(c=>c.id===S.closure); c.previousCorrections=[...(c.previousCorrections||[]),...(c.corrected?[c.corrected]:[])]; c.corrected={counted:+S.counted,by:'Paul',at:'Mon 17:30',reason:S.reason.trim()}; c.settled=true; S.sheet=null; break; }
    case 'retry': S.error=false; break;
    case 'print': window.print(); return;
    case 'export': exportReport(); S.pop=null; break;

    case 'view': S.sheet=null; S.detail=null; S.closure=null; S.xreport=false; S.empty=false; S.loading=false; S.view = v; S.pop = null; S.tip = null; break;
    case 'preset': { const [g, o] = v.split(':'); S.gran = g; S.off = +o; S.tip = null; S.pop = null; S.rangeErr = null; break; }
    case 'applyRange': {
      const f = F.querySelector('#cFrom').value, t = F.querySelector('#cTo').value;
      const toOff = d => Math.round((TODAY - new Date(d + 'T00:00:00')) / 86400000);
      const a = toOff(f), z = toOff(t);
      if (!f || !t || isNaN(a) || isNaN(z) || a < z || z < 0) { S.rangeErr = 'Pick a start on or before the end, no later than today.'; break; }
      if (a >= RETENTION_DAYS) { S.rangeErr = 'That is further back than your history goes. Longer runs are in WP Admin › Analytics.'; break; }
      S.gran = 'custom'; S.cFrom = a; S.cTo = z; S.off = 0; S.tip = null; S.pop = null; S.rangeErr = null; break;
    }
    case 'step':
      if (!S.pro && +v > 0) { openPop('hint', anchor, 'earlier'); break; }
      S.off = Math.max(0, S.off + +v); S.tip = null; S.pop = null; break;
    case 'pop': S.pop && S.pop.kind === el.dataset.p ? (S.pop = null) : openPop(el.dataset.p, anchor, v); break;
    case 'closePop': S.pop = null; S.hint = null; break;
    case 'hint': if (!S.pop) openPop('hint', anchor, v); else S.hint=v; break;
    case 'register': S.register = v; S.pop = null; break;
    case 'store': S.store = v; S.pop = null; break;
    case 'cashier': S.cashier = v; S.pop = null; Object.keys(ORD_CACHE).forEach(k => delete ORD_CACHE[k]); break;
    case 'status': S.status = v; S.pop = null; break;
    case 'cmp': if (!S.pro && v === 'lastyear') { S.hint = 'lastyear'; break; } S.cmp = v; S.pop = null; break;
    case 'detail': S.detail = v; S.tpl = 'default'; S.pop = null; break;
    case 'closePanel': S.detail = null; S.closure = null; S.xreport = false; S.pop = null; break;
    case 'closure': S.closure = v; S.xreport = false; S.tpl = 'default'; S.pop = null; break;
    case 'reprint': S.closure = v; S.tpl = 'default'; break;
    case 'xreport': S.xreport = true; S.closure = null; S.tpl = 'default'; break;
    case 'tick': { if (S.unticked.has(el.dataset.k)) S.unticked.delete(el.dataset.k); else S.unticked.add(el.dataset.k); break; }
    case 'tickAll': { const all = ordersFor(S.gran, S.off); const anyOff = all.some(o => S.unticked.has(o.key)); all.forEach(o => anyOff ? S.unticked.delete(o.key) : S.unticked.add(o.key)); break; }
    case 'resetTicks': S.unticked.clear(); break;
    case 'tpl': S.tpl = v; S.pop = null; break;
    case 'toast': toast(v); S.pop = null; break;
  }
  render();
});

function jump(scn){
  Object.assign(S,{scn,view:'sales',online:true,regOpen:true,gran:'day',off:0,register:'front',store:'uk',cashier:'all',status:'done',unticked:new Set(),detail:null,closure:null,xreport:false,tpl:'default',pop:null,hint:null,tip:null,sheet:null,loading:false,empty:false,error:false,reason:'',counted:'',pieces:{},denominations:false});

  if(!S.sheet)return '';
  const wrap=(title,body,foot='',context='')=>`<div class="sheet-wrap" data-act="closeSheet"><section class="sheet" data-stop="1" role="dialog" aria-label="${title}"><div class="sheet-h"><div class="grow"><div class="t">${title}</div>${context?`<div class="sheet-context">${context}</div>`:''}</div><button class="ibtn press" data-act="closeSheet" aria-label="Close">${I.x}</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:''}</section></div>`;
  if(S.sheet==='recount'){const c=CLOSURES.find(c=>c.id===S.closure);return wrap('Recount',`${!S.online?'<div data-testid="recount-offline">Connect to recount</div>':''}<label class="fld" for="recount-total">Counted total · cash<input id="recount-total" class="in" type="number" min="0" step="0.01" value="${S.counted}" inputmode="decimal"></label><div class="fold"><button data-act="denominations" aria-expanded="${S.denominations}"><span class="grow">Count by denominations</span>${S.denominations?I.chevu:I.chevd}</button>${S.denominations?`<div class="denominations">${[50,20,10,5,2,1,.5,.2,.1,.05,.02,.01].map(n=>`<button class="btn press" data-act="denomination" data-v="${n}">${fmt(n)} · ${S.pieces[n]||0}</button>`).join('')}</div>`:''}</div><label class="fld" for="recount-reason">Reason (required)<input id="recount-reason" class="in" maxlength="500" value="${esc(S.reason)}" required></label><span class="mut">Up to 500 characters</span><div class="row">${status('ok','Manager approval')}<span class="mut">Paul</span></div>`,`<button class="btn press" data-act="closeSheet">Cancel</button><button id="save-recount" class="btn p press" data-act="saveRecount" ${!S.online||!S.reason.trim()||S.counted===''||!Number.isFinite(+S.counted)||+S.counted<0?'disabled':''}>${S.online?'Save recount':'Connect to recount'}</button>`,`Recorded ${fmt(c.counted)} · expected ${fmt(c.float+c.cash-c.cashOut)}`);}
  if(S.sheet==='user')return wrap('Demo Cashier','<span class="mut">Cashier · UK Store</span>', '<button class="btn press" data-act="closeSheet">Close</button>');
  if(S.sheet==='menu')return wrap('Reports',`<button class="pr" data-act="view" data-v="sales">Sales</button><button class="pr" data-act="view" data-v="closures">Closures</button>`);
  return wrap('Prototype',esc(S.result||''),'<button class="btn press" data-act="closeSheet">Close</button>');
}
function exportReport(){
  const cells=S.closure?[CLOSURES.find(c=>c.id===S.closure)]:S.view==='closures'?closureRows().filter(c=>S.pro||c.day===0):null;
  const data=cells?[['Business day','Closure','Register','Store','Opened','Closed','Closed by','Expected (cash)','Counted (cash)','Variance (cash)','Status'],...cells.map(c=>[isoOf(c.day),c.num,c.reg,'UK Store',c.open,c.close,c.by,fmt(c.float+c.cash-c.cashOut),fmt(c.counted),fmt(Math.abs(c.variance))+' '+(c.variance<0?'short':c.variance>0?'over':'Exact'),c.unsynced?'Unsynced':c.corrected?'Corrected':''])]:[S.spec.head,...S.spec.rows.filter(r=>typeof r!=='string'&&!r.off),...(S.spec.tot?[S.spec.tot]:[])];
  const csv=data.map(row=>row.map(v=>'"'+String(v).replace(/<[^>]+>/g,' ').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})), a=document.createElement('a');a.href=url;a.download=(S.closure?'closure':S.detail||'closures')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.addEventListener('change',e=>{if(e.target.id==='template'){S.tpl=e.target.value;render();}});
document.addEventListener('input',e=>{if(!['recount-total','recount-reason'].includes(e.target.id))return;S[e.target.id==='recount-total'?'counted':'reason']=e.target.value;if(e.target.id==='recount-total')S.pieces={};document.getElementById('save-recount').disabled=!S.online||!S.reason.trim()||S.counted===''||!Number.isFinite(+S.counted)||+S.counted<0;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click();});
F.addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(b){S[b.dataset.set]=b.dataset.v;render();}});
render();
</script>
