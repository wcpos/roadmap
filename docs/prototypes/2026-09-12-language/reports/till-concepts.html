<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Till strip · ten concepts</title>
<!-- Paul 2026-09-17: "you're just doing minor variations. We need to go back to the drawing board, scrap everything, and find some
     interesting ways to present this information." Ten different pictures of the same fact: a drawer opened with a float, took cash
     sales, had cash taken out, and will be counted tonight. No chips. Each at the desktop page width with a busy-till switch. -->
<style>
:root{--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
body{margin:0;background:#141416;color:#ddd;font:14px/1.4 var(--font)}
.strip{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;padding:10px 18px;background:#1c1c1f;border-bottom:1px solid #2a2a2e}
.strip b{font-weight:600;margin-right:8px;color:#aaa}.seg{display:inline-flex;border:1px solid #3a3a40;border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:#bbb;padding:5px 10px;font:inherit;cursor:pointer}.seg button.on{background:#e8e8ea;color:#111}
.stage{padding:24px 18px 60px;display:flex;flex-direction:column;gap:30px;align-items:flex-start}
h1{font-size:16px;margin:8px 0 0;color:#eee}h1+p{margin:0 0 6px;color:#999;max-width:1100px}
h2{font-size:13px;font-weight:600;margin:0 0 8px;color:#eee}
.opt .why{color:#9a9aa0;margin:8px 0 0;font-size:12.5px;max-width:1100px}

.frame{--u:4px;--fs:14px;--r:8px;--hair:1px;
  --bg:oklch(0.975 0.004 250);--fg:oklch(0.22 0.02 250);--card:oklch(1 0 0);--muted:oklch(0.955 0.006 250);--muted-fg:oklch(0.50 0.02 250);--border:oklch(0.90 0.008 250);
  --primary:oklch(0.50 0.18 240);--primary-fg:oklch(0.99 0.01 240);--ok:oklch(0.55 0.16 155);--bad:oklch(0.58 0.2 25);--warn:oklch(0.68 0.16 70);--c2:oklch(0.62 0.15 160);--c3:oklch(0.72 0.15 70);
  color-scheme:light;background:var(--bg);color:var(--fg);font:var(--fs)/1.4 var(--font);padding:12px;border-radius:10px;width:1114px;box-sizing:border-box}
.frame[data-theme="dark"]{--bg:oklch(0.19 0.018 250);--fg:oklch(0.93 0.01 250);--card:oklch(0.23 0.018 250);--muted:oklch(0.28 0.018 250);--muted-fg:oklch(0.70 0.015 250);--border:oklch(0.33 0.02 250);
  --primary:oklch(0.70 0.17 240);--primary-fg:oklch(0.16 0.02 250);--ok:oklch(0.72 0.15 155);--bad:oklch(0.68 0.18 25);--warn:oklch(0.78 0.15 75);--c2:oklch(0.75 0.14 160);--c3:oklch(0.80 0.14 75);color-scheme:dark}
.frame button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mut{color:var(--muted-fg)}.sm{font-size:calc(var(--fs)*.9)}.xs{font-size:calc(var(--fs)*.86)}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.st i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}
.card{background:var(--card);border:var(--hair) solid var(--border);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:var(--hair) solid var(--border);border-radius:var(--r);font-weight:500;background:var(--card);white-space:nowrap}.btn svg{width:16px;height:16px}
.ibtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-fg)}.ibtn svg{width:16px;height:16px}
.row{display:flex;align-items:center;gap:16px}.grow{flex:1;min-width:0}
svg.plot{display:block;overflow:visible}svg.plot text{font-family:var(--font)}
.who{display:flex;align-items:center;gap:6px;white-space:nowrap}
/* C1 receipt */
.rcpt{display:flex;align-items:stretch;gap:0}.paper{font-family:var(--mono);font-size:12.5px;line-height:1.45;background:var(--card);padding:10px 16px 12px;position:relative;min-width:300px;color:var(--fg);border-left:var(--hair) solid var(--border);border-right:var(--hair) solid var(--border)}
.paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:6px;background:radial-gradient(circle at 6px 0,transparent 3px,var(--card) 3.5px) 0 0/12px 6px}.paper::before{top:-6px;transform:scaleY(-1)}.paper::after{bottom:-6px}
.paper .h{text-align:center;font-weight:700;letter-spacing:.08em}.paper .l{display:flex;justify-content:space-between;gap:12px}.paper .l.t{border-top:1px dashed var(--border);margin-top:4px;padding-top:4px;font-weight:700}.paper .dim{color:var(--muted-fg)}
/* C2 the drawer */
.tray{display:flex;gap:5px;align-items:flex-end}.cupw{display:flex;flex-direction:column;align-items:center;gap:3px}.cup{width:60px;height:60px;border:var(--hair) solid var(--border);border-radius:5px 5px 9px 9px;background:var(--muted);position:relative;overflow:hidden}.cup i{position:absolute;left:0;right:0;bottom:0;background:var(--primary);opacity:.85}.cup i.ghost{background:var(--border);opacity:1}.cupw span{font-size:10px;color:var(--muted-fg)}.cup.coin{width:36px;border-radius:50% 50% 9px 9px}
/* C3 cash level */
.lvl{flex:1}
/* C4 to bank */
.bank{display:flex;align-items:center;gap:24px}.bank .bignum{display:flex;flex-direction:column}.bank .a{font-size:calc(var(--fs)*2.1);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}.bank .l{color:var(--muted-fg)}.bag{display:flex;height:16px;border-radius:8px;overflow:hidden;width:320px}.bag i{display:block;height:100%}
/* C5 gauge */
/* C6 sentence */
.prose{font-size:calc(var(--fs)*1.1);line-height:1.55;max-width:820px}.prose b{font-weight:600;font-variant-numeric:tabular-nums}.prose .res{background:var(--primary);color:var(--primary-fg);padding:1px 8px;border-radius:6px;font-weight:700;white-space:nowrap}
/* C7 before after */
.ba{display:flex;align-items:center;gap:18px}.stack{display:flex;flex-direction:column-reverse;gap:2px;width:80px}.stack i{display:block;height:6px;border-radius:2px;background:var(--primary)}.stack i.f{background:var(--border)}.stack+.cap{margin-left:-8px}.ba .cap{text-align:center;font-size:calc(var(--fs)*.86);color:var(--muted-fg)}.ba .cap b{display:block;font-size:var(--fs);color:var(--fg);font-variant-numeric:tabular-nums}.ba .arrows{display:flex;flex-direction:column;gap:4px;font-size:calc(var(--fs)*.9)}.ba .arrows span{display:flex;gap:8px;align-items:center}.ba .arrows b{font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
/* C8 handovers */
.av{width:26px;height:26px;border-radius:50%;background:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
/* C9 ledger */
.book{font-family:var(--mono);font-size:12.5px;border-collapse:collapse;width:auto;flex:none}.book td,.book th{padding:2px 12px 2px 0;text-align:left;white-space:nowrap}.book th{color:var(--muted-fg);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase}.book td.r,.book th.r{text-align:right}.book tr.tot td{border-top:1px solid var(--border);font-weight:700;padding-top:4px}.book .dim{color:var(--muted-fg)}
/* C10 scoreboard */
.score{display:flex;gap:4px}.score .cell{background:var(--fg);color:var(--bg);padding:8px 18px 10px;border-radius:6px;text-align:center;min-width:120px}.score .cell .n{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1}.score .cell .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:4px}.score .cell.hot{background:var(--primary);color:var(--primary-fg)}
</style>
<div class="strip">
  <span><b>Theme</b><span class="seg"><button class="on" data-set="theme" data-v="light">Light</button><button data-set="theme" data-v="dark">Dark</button></span></span>
  <span><b>Till</b><span class="seg"><button class="on" data-set="busy" data-v="0">Ordinary</button><button data-set="busy" data-v="1">Busy · paid-in, two paid-outs, refunds</button></span></span>
</div>
<div class="stage" id="stage"></div>
<script>
const fmt=(n,sign=false)=>{const a=Math.abs(n).toFixed(2);return `${n<0?'−':sign&&n>0?'+':''}£${a}`};const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const print='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2"/><path d="M17 9V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v4"/><rect x="7" y="13" width="10" height="8" rx="2"/></svg>';
const S={theme:'light',busy:'0'};
/* the session as events in time order (the plugin has every one of these with a time and an actor) */
const EV=()=>S.busy==='1'
  ?[{t:'13:00',k:'float',l:'Opening float',by:'Dylan',amt:100},{t:'13:20',k:'in',l:'Paid in · change from the safe',by:'Dylan',amt:20},{t:'13:20',k:'sale',l:'Cash sale',amt:49},{t:'14:12',k:'nosale',l:'No sale · drawer opened',amt:0},{t:'15:15',k:'sale',l:'Cash sale',amt:88.20},{t:'15:40',k:'out',l:'Paid out · to bank',by:'Dylan',amt:-150},{t:'16:02',k:'sale',l:'Cash sale',amt:134.70},{t:'16:05',k:'out',l:'Paid out · milk, petty cash',by:'Dylan',amt:-30},{t:'16:20',k:'refund',l:'Cash refund · #1231',amt:-12.50},{t:'16:44',k:'sale',l:'Cash sale',amt:12.80},{t:'17:10',k:'sale',l:'Cash sale',amt:59}]
  :[{t:'13:00',k:'float',l:'Opening float',by:'Dylan',amt:100},{t:'13:20',k:'sale',l:'Cash sale',amt:49},{t:'15:15',k:'sale',l:'Cash sale',amt:88.20},{t:'15:40',k:'out',l:'Paid out · to bank',by:'Dylan',amt:-150},{t:'16:02',k:'sale',l:'Cash sale',amt:134.70},{t:'16:44',k:'sale',l:'Cash sale',amt:12.80},{t:'17:10',k:'sale',l:'Cash sale',amt:59}];
const FLOAT=100, LIMIT=300;
const totals=()=>{const e=EV();return {sales:sum(e.filter(x=>x.k==='sale'),x=>x.amt),salesN:e.filter(x=>x.k==='sale').length,ins:sum(e.filter(x=>x.k==='in'),x=>x.amt),outs:-sum(e.filter(x=>x.k==='out'),x=>x.amt),refunds:-sum(e.filter(x=>x.k==='refund'),x=>x.amt),expected:sum(e,x=>x.amt)}};
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

const C={};
/* C1 · the receipt: the X-report is the strip */
C['C1']=['The receipt','The strip is the X-report itself, set as a thermal ticket with its torn edge. Nothing is invented for the screen: this is the document the cashier will print. The busy day is simply a longer ticket.',()=>{const T=totals(),e=EV();
  const lines=[['OPENING FLOAT',FLOAT],[`CASH SALES x${T.salesN}`,T.sales],...(T.ins?[['PAID IN',T.ins]]:[]),...e.filter(x=>x.k==='out').map(x=>[x.l.replace('Paid out · ','PAID OUT · ').toUpperCase(),x.amt]),...(T.refunds?[['CASH REFUNDS',-T.refunds]]:[])];
  return `<div class="row"><div class="rcpt"><div class="paper"><div class="h">X-REPORT · FRONT TILL</div><div class="dim" style="text-align:center">Mon 14 Sep · opened 13:00 by Dylan</div><div style="height:6px"></div>${lines.map(([l,v])=>`<div class="l"><span>${l}</span><span>${v<0?'-':''}${Math.abs(v).toFixed(2)}</span></div>`).join('')}<div class="l t"><span>EXPECTED IN DRAWER</span><span>${T.expected.toFixed(2)}</span></div></div></div><div class="grow"><div class="who"><b>Front till</b> <span class="st ok"><i></i>Open</span><span class="mut"> · since 13:00 · Dylan</span></div><div class="mut sm">Last closure #412 · Today 12:30 · £2.00 short</div><div style="height:10px"></div><button class="btn">${print}Print this</button></div><button class="ibtn">${chev}</button></div>`;}];
/* C2 · the drawer */
C['C2']=['The drawer','A cash tray, five note cups and a row of coin cups, each filling with what should be in it. The float sits in grey at the bottom of every cup. A cashier looks at a real drawer all day; this is the one picture they already know how to read.',()=>{const T=totals();
  const notes=[['£50',.18],['£20',.34],['£10',.22],['£5',.14]],coins=[['£2',.04],['£1',.04],['50p',.02],['20p',.01],['10p',.01]];
  const cup=(l,sh,coin)=>`<div class="cupw"><div class="cup ${coin?'coin':''}"><i style="height:${Math.round(58*Math.min(1,(T.expected*sh)/(coin?12:110)))}px"></i><i class="ghost" style="height:${Math.round(58*Math.min(1,(FLOAT*sh)/(coin?12:110)))}px"></i></div><span>${l}</span></div>`;
  return `<div class="row"><div class="tray">${notes.map(([l,s])=>cup(l,s,false)).join('')}<div style="width:10px"></div>${coins.map(([l,s])=>cup(l,s,true)).join('')}</div><div class="grow"><div class="who"><b>Front till</b> <span class="st ok"><i></i>Open</span><span class="mut"> · since 13:00 · Dylan</span></div><div><span style="font-size:1.6em;font-weight:700;font-variant-numeric:tabular-nums">${fmt(T.expected)}</span> <span class="mut">should be in the drawer · float ${fmt(FLOAT)} in grey</span></div><div class="mut sm">Last closure #412 · Today 12:30 · £2.00 short</div></div><button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];
/* C3 · the cash level through the session */
C['C3']=['The cash level through the session','How the drawer filled: a line from the float at 13:00 to now, stepping up with every cash sale and dropping where cash left. The paid-out is a visible cliff. Read the shape and you know the afternoon.',()=>{const e=EV(),W=620,H=96,t0=mins('13:00'),t1=mins('17:30');let bal=0;const pts=[];e.forEach(x=>{const b0=bal;bal+=x.amt;pts.push([mins(x.t),b0,bal,x]);});const max=Math.max(...pts.map(p=>Math.max(p[1],p[2])))*1.1;const X=t=>16+(W-32)*(t-t0)/(t1-t0),Y=v=>10+(H-30)*(1-v/max);
  let d=`M${X(t0)},${Y(0)}`;let cur=0;pts.forEach(([t,b0,b1])=>{d+=` L${X(t)},${Y(b0)} L${X(t)},${Y(b1)}`;cur=b1;});d+=` L${X(t1)},${Y(cur)}`;
  let svg=`<svg class="plot" viewBox="0 0 ${W} ${H}" style="width:${W}px"><path d="${d} L${X(t1)},${Y(0)} L${X(t0)},${Y(0)} Z" fill="var(--primary)" fill-opacity=".1"/><path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2"/>`;
  svg+=`<line x1="${X(t0)}" x2="${X(t1)}" y1="${Y(FLOAT)}" y2="${Y(FLOAT)}" stroke="var(--border)" stroke-dasharray="3 3"/><text x="${X(t0)}" y="${Y(FLOAT)-4}" font-size="10" fill="var(--muted-fg)">float £100</text>`;
  let k=0;pts.filter(p=>p[3].k==='out'||p[3].k==='in'||p[3].k==='refund').forEach(([t,b0,b1,x])=>{const up=x.amt>0,dy=up?-10-(k%2)*12:14+(k%2)*12;k++;svg+=`<circle cx="${X(t)}" cy="${Y(b1)}" r="4" fill="${x.amt<0?'var(--warn)':'var(--c2)'}"/><text x="${X(t)}" y="${Y(b1)+dy}" text-anchor="middle" font-size="10.5" fill="var(--fg)">${fmt(x.amt,true)} <tspan fill="var(--muted-fg)">${(x.l.split(' · ')[1]||x.l).replace(', petty cash','').replace('change from the safe','from safe').replace('#1231','refund')}</tspan></text>`;});
  svg+=`<circle cx="${X(t1)}" cy="${Y(cur)}" r="4" fill="var(--primary)"/><text x="${X(t1)-8}" y="${Y(cur)-9}" text-anchor="end" font-size="12" font-weight="600" fill="var(--fg)">${fmt(cur)} now</text>`;
  ['13:00','14:00','15:00','16:00','17:00'].forEach(t=>svg+=`<text x="${X(mins(t))}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted-fg)">${t}</text>`);svg+='</svg>';
  return `<div class="row"><div class="grow" style="flex:0 0 220px"><div class="who"><b>Front till</b> <span class="st ok"><i></i>Open</span></div><div class="mut sm">since 13:00 · Dylan</div><div class="mut sm">Last closure #412 · £2.00 short</div></div><div class="lvl">${svg}</div><button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];
/* C4 · what leaves tonight */
C['C4']=['What leaves the drawer tonight','Not what is in it, what happens to it. Tonight £193.70 goes to the bank and £100 stays as tomorrow’s float; that is the number the cashier bags. The drawer total is the sum of the two segments.',()=>{const T=totals(),bankIt=T.expected-FLOAT;
  return `<div class="bank"><div class="bignum"><span class="a">${fmt(bankIt)}</span><span class="l">to bank tonight</span></div><div><div class="bag"><i style="flex:${FLOAT};background:var(--border)"></i><i style="flex:${bankIt};background:var(--primary)"></i></div><div class="mut sm" style="margin-top:6px">keep <b>${fmt(FLOAT)}</b> float · bank <b>${fmt(bankIt)}</b> · drawer holds <b>${fmt(T.expected)}</b>${T.outs?` · <b>${fmt(T.outs)}</b> already went out today`:''}</div></div><div class="grow" style="text-align:right"><div class="who" style="justify-content:flex-end"><b>Front till</b> <span class="st ok"><i></i>Open</span><span class="mut"> · Dylan</span></div><div class="mut sm">Last closure #412 · £2.00 short</div></div><button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];
/* C5 · the drawer limit gauge */
C['C5']=['Against the drawer limit','Shops set a cash limit for the drawer, the point at which cash goes to the safe. The gauge is that limit; the needle is what should be in the drawer. It is the only picture here that tells the cashier to do something.',()=>{const T=totals(),f=Math.min(1,T.expected/LIMIT),R=54,Cc=Math.PI*R;
  const gauge=`<svg class="plot" viewBox="0 0 140 84" style="width:140px"><path d="M16 74 A54 54 0 0 1 124 74" fill="none" stroke="var(--muted)" stroke-width="14" stroke-linecap="round"/><path d="M16 74 A54 54 0 0 1 124 74" fill="none" stroke="${f>.9?'var(--warn)':'var(--primary)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(Cc*f).toFixed(1)} ${Cc.toFixed(1)}"/><text x="70" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="var(--fg)">${fmt(T.expected)}</text><text x="70" y="80" text-anchor="middle" font-size="10" fill="var(--muted-fg)">of £${LIMIT} limit</text></svg>`;
  return `<div class="row">${gauge}<div class="grow"><div class="who"><b>Front till</b> <span class="st ok"><i></i>Open</span><span class="mut"> · since 13:00 · Dylan</span></div><div>${T.expected>LIMIT*.9?`<span class="st warn"><i></i>Near the limit · bank ${fmt(T.expected-FLOAT)} before close</span>`:`<span class="st ok"><i></i>${fmt(LIMIT-T.expected)} under the drawer limit</span>`}</div><div class="mut sm">Last closure #412 · Today 12:30 · £2.00 short</div></div><button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];
/* C6 · a sentence */
C['C6']=['It just tells you','No picture. The app says what happened in a sentence, in the language’s own voice, with the figures bold and the result marked. It grows into a second sentence on a busy day and reads the same on a phone.',()=>{const T=totals(),e=EV(),outs=e.filter(x=>x.k==='out');
  const s1=`Dylan opened Front till at 13:00 with <b>${fmt(FLOAT)}</b>. ${T.salesN} cash sales added <b>${fmt(T.sales)}</b>${T.ins?`, <b>${fmt(T.ins)}</b> came in from the safe`:''}${outs.length?`, and he ${outs.length>1?`took out <b>${fmt(T.outs)}</b> (${outs.map(x=>x.l.split(' · ')[1]).join(', ')})`:`banked <b>${fmt(T.outs)}</b> at ${outs[0].t}`}`:''}${T.refunds?`, with <b>${fmt(T.refunds)}</b> refunded in cash`:''}, so the drawer should hold <span class="res">${fmt(T.expected)}</span>.`;
  return `<div class="row"><div class="prose grow">${s1} <span class="mut">Priya’s closure this morning was £2.00 short.</span></div><button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];
/* C7 · before and after */
C['C7']=['Opened with, holds now','Two stacks of notes: what the drawer opened with, what it should hold now, and the changes written between them with arrows. The growth is the picture; the maths is the caption.',()=>{const T=totals(),e=EV();const bars=n=>Array.from({length:Math.max(1,Math.round(n/20))},(_,i)=>`<i class="${i<FLOAT/20?'f':''}"></i>`).join('');
  return `<div class="ba"><div><div class="stack">${bars(FLOAT)}</div><div class="cap"><b>${fmt(FLOAT)}</b>opened with · 13:00</div></div><div class="arrows"><span class="mut">→</span><span><b>${fmt(T.sales,true)}</b> ${T.salesN} cash sales</span>${T.ins?`<span><b>${fmt(T.ins,true)}</b> paid in</span>`:''}${e.filter(x=>x.k==='out').map(x=>`<span><b>${fmt(x.amt,true)}</b> ${x.l.split(' · ')[1]}</span>`).join('')}${T.refunds?`<span><b>${fmt(-T.refunds,true)}</b> refunds</span>`:''}</div><div><div class="stack">${bars(T.expected)}</div><div class="cap"><b>${fmt(T.expected)}</b>holds now · 17:30</div></div><div class="grow" style="text-align:right"><div class="who" style="justify-content:flex-end"><b>Front till</b> <span class="st ok"><i></i>Open</span><span class="mut"> · Dylan</span></div><div class="mut sm">Last closure #412 · £2.00 short</div></div><button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];
/* C8 · handovers */
C['C8']=['The day as handovers','People, not money, first. Priya had the till until 12:30 and closed it £2.00 short; Dylan has had it since 13:00 and should be holding £293.70. Each person is a segment on the day’s line with their result at the end of it.',()=>{const T=totals(),W=700,t0=8*60,t1=20*60,X=t=>12+(W-24)*(t-t0)/(t1-t0);
  const seg=(a,b,fill,label,res)=>`<rect x="${X(mins(a))}" y="14" width="${X(mins(b))-X(mins(a))}" height="28" rx="14" fill="${fill}"/><text x="${X(mins(a))+36}" y="32" font-size="12" fill="var(--fg)">${label}</text>${res}`;
  let svg=`<svg class="plot" viewBox="0 0 ${W} 60" style="width:${W}px"><line x1="12" x2="${W-12}" y1="28" y2="28" stroke="var(--border)"/>`;
  svg+=seg('09:02','12:30','var(--muted)','Priya · 09:02–12:30',`<text x="${X(mins('12:30'))}" y="9" text-anchor="end" font-size="11" font-weight="600" fill="var(--warn)">£2.00 short</text>`);
  svg+=seg('13:00','17:30','color-mix(in oklch, var(--primary) 14%, var(--card))','Dylan · since 13:00',`<text x="${X(mins('17:30'))-8}" y="32" text-anchor="end" font-size="11" font-weight="600" fill="var(--primary)">${fmt(T.expected)} in drawer</text>`);
  svg+=`<circle cx="${X(mins('09:02'))+14}" cy="28" r="10" fill="var(--card)" stroke="var(--border)"/><text x="${X(mins('09:02'))+14}" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)">P</text><circle cx="${X(mins('13:00'))+14}" cy="28" r="10" fill="var(--primary)"/><text x="${X(mins('13:00'))+14}" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="var(--primary-fg)">D</text>`;
  ['8am','10am','12pm','2pm','4pm','6pm','8pm'].forEach((l,i)=>svg+=`<text x="${X(t0+i*120)}" y="56" text-anchor="middle" font-size="10" fill="var(--muted-fg)">${l}</text>`);svg+=`<line x1="${X(mins('17:30'))}" x2="${X(mins('17:30'))}" y1="8" y2="46" stroke="var(--fg)" stroke-dasharray="2 3"/></svg>`;
  return `<div class="row"><div class="grow" style="flex:0 0 150px"><div class="who"><b>Front till</b></div><div class="mut sm">2 sessions today</div></div>${svg}<button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];
/* C9 · the book */
C['C9']=['The cash book','A bookkeeper’s ledger: every cash event in time order with a running balance, sales folded into one line. The oldest way to show money moving, and the one an accountant will trust without asking.',()=>{const e=EV();let bal=0;const rows=[];const sales=e.filter(x=>x.k==='sale');
  e.forEach(x=>{if(x.k==='sale')return;bal+=x.amt;rows.push([x.t,x.l,x.amt,bal,x.by||'']);});
  const salesAmt=sum(sales,x=>x.amt);const all=[...rows.map(r=>({t:r[0],l:r[1],amt:r[2],by:r[4]})),{t:`${sales[0].t}–${sales[sales.length-1].t}`,l:`Cash sales × ${sales.length}`,amt:salesAmt,by:''}].sort((a,b)=>a.t.localeCompare(b.t));let run=0;
  return `<div class="row"><table class="book"><tr><th>Time</th><th>Entry</th><th>By</th><th class="r">In</th><th class="r">Out</th><th class="r">Balance</th></tr>${all.map(x=>{run+=x.amt;return `<tr><td class="dim">${x.t}</td><td>${x.l}</td><td class="dim">${x.by}</td><td class="r">${x.amt>0?x.amt.toFixed(2):''}</td><td class="r">${x.amt<0?Math.abs(x.amt).toFixed(2):x.amt===0?'—':''}</td><td class="r">${run.toFixed(2)}</td></tr>`}).join('')}<tr class="tot"><td></td><td>Expected in drawer</td><td></td><td></td><td></td><td class="r">${run.toFixed(2)}</td></tr></table><div class="grow" style="text-align:right;align-self:flex-start;min-width:200px"><div class="who" style="justify-content:flex-end"><b>Front till</b> <span class="st ok"><i></i>Open</span><span class="mut"> · Dylan</span></div><div class="mut sm">Last closure #412 · £2.00 short</div><div style="height:8px"></div><button class="btn">${print}X-report</button> <button class="ibtn">${chev}</button></div></div>`;}];
/* C10 · the scoreboard */
C['C10']=['The scoreboard','Three numbers in lights: in, out, drawer. Stadium type, no maths shown, the drawer cell lit. For the wall-mounted tablet at the back of the shop, where nobody is going to read a label.',()=>{const T=totals();const cell=(l,n,hot)=>`<div class="cell ${hot?'hot':''}"><div class="l">${l}</div><div class="n">${n}</div></div>`;
  return `<div class="row"><div class="score">${cell('Float',fmt(FLOAT))}${cell('In',fmt(T.sales+T.ins))}${cell('Out',fmt(T.outs+T.refunds))}${cell('Drawer',fmt(T.expected),true)}</div><div class="grow"><div class="who"><b>Front till</b> <span class="st ok"><i></i>Open</span><span class="mut"> · since 13:00 · Dylan</span></div><div class="mut sm">Last closure #412 · Today 12:30 · £2.00 short</div></div><button class="btn">${print}X-report</button><button class="ibtn">${chev}</button></div>`;}];

function render(){
  document.querySelectorAll('.strip [data-set]').forEach(b=>b.classList.toggle('on',S[b.dataset.set]===b.dataset.v));
  document.getElementById('stage').innerHTML=`<h1>The till, ten different pictures</h1><p>Same session in every one: Front till, opened at 13:00 by Dylan with £100, cash sales, a paid-out to the bank, £293.70 expected now. Switch to the busy till for a paid-in, two paid-outs and cash refunds.</p>`+Object.entries(C).map(([k,[t,why,f]])=>`<div class="opt"><h2>${k} · ${t}</h2><div class="frame" data-theme="${S.theme}"><section class="card" style="padding:12px 16px">${f()}</section></div><p class="why">${why}</p></div>`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b)return;S[b.dataset.set]=b.dataset.v;render();});
render();
</script>
</html>
