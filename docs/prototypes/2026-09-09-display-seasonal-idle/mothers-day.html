<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mother&#x27;s Day — Bloom</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:#fbf3ea;display:flex;align-items:center;justify-content:center;color:#5c3a2e}
.bloom{position:absolute;width:min(78vh,620px);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%)}
.bloom i{position:absolute;left:50%;top:50%;width:26%;height:46%;margin:-23% 0 0 -13%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(180deg,#f9b8a8,#ef8f7a);opacity:.9;transform:rotate(var(--r)) translateY(-40%)}
.bloom:after{content:"";position:absolute;inset:27%;border-radius:50%;background:#fff6ec;box-shadow:0 20px 50px rgba(92,58,46,.12)}
.inner{position:relative;text-align:center;max-width:min(360px,60vw)}
.brand{height:76px;width:auto;object-fit:contain;display:block;margin:0 auto 10px}
h1{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;font-weight:600;font-size:clamp(30px,4.2vw,52px);margin:0 0 8px;color:#b4443f;line-height:1;text-wrap:balance}
p{margin:0;font-size:clamp(16px,1.9vw,22px);color:#7a5246;text-wrap:balance}
.leaf{position:absolute;width:140px;height:60px;background:#7fae7c;border-radius:0 60px 0 60px;opacity:.85}
.leaf.a{left:6vw;bottom:8vh;transform:rotate(-20deg)} .leaf.b{right:6vw;top:8vh;transform:rotate(160deg)}
@media (max-width:600px){.bloom{width:120vw}.leaf{width:90px;height:40px}}
@keyframes md-bloom{0%,100%{transform:translate(-50%,-50%) rotate(0) scale(1)}50%{transform:translate(-50%,-50%) rotate(3deg) scale(1.02)}}@keyframes md-leaf{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-14deg)}}@media (prefers-reduced-motion:no-preference){.bloom{animation:md-bloom 9s ease-in-out infinite}.leaf.a{animation:md-leaf 6s ease-in-out infinite}}
</style>
<section class="s"><div class="bloom"><i style="--r:0deg"></i><i style="--r:30deg"></i><i style="--r:60deg"></i><i style="--r:90deg"></i><i style="--r:120deg"></i><i style="--r:150deg"></i><i style="--r:180deg"></i><i style="--r:210deg"></i><i style="--r:240deg"></i><i style="--r:270deg"></i><i style="--r:300deg"></i><i style="--r:330deg"></i></div><div class="leaf a"></div><div class="leaf b"></div>
<div class="inner"><img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster"><h1>Happy Mother's Day</h1><p>To the ones who do it all.</p></div></section>
</body></html>
