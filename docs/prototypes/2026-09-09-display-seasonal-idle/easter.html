<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easter — Spring</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:linear-gradient(160deg,#dff3e6 0%,#fbf7d5 100%);display:flex;align-items:center;justify-content:center;color:#2f4f3a}
.inner{text-align:center;margin-bottom:12vh}
.brand{height:90px;width:auto;object-fit:contain;display:block;margin:0 auto 12px}
h1{margin:0 0 10px;font-size:clamp(46px,7vw,96px);font-weight:800;letter-spacing:-.02em;color:#3d7a57;line-height:1}
p{margin:0;font-size:clamp(17px,2vw,24px);color:#557a64}
.eggs{position:absolute;left:0;right:0;bottom:-40px;display:flex;justify-content:center;gap:24px;align-items:flex-end}
.egg{width:120px;height:160px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:inset -12px -10px 0 rgba(0,0,0,.08)}
.egg.a{background:repeating-linear-gradient(0deg,#f6a5c1 0 16px,#fde2ec 16px 32px)}
.egg.b{background:radial-gradient(circle,#fff 0 8px,transparent 9px) 0 0/34px 34px,#8fd3f4}
.egg.c{background:repeating-linear-gradient(45deg,#ffd166 0 14px,#fff1c2 14px 28px)}
.egg.d{background:radial-gradient(circle,#fff 0 6px,transparent 7px) 8px 8px/28px 28px,#b5e48c}
.egg.e{background:repeating-linear-gradient(0deg,#c7a6f4 0 16px,#ebdcff 16px 32px)}
@media (max-width:600px){.egg{width:64px;height:88px}.eggs{gap:10px;bottom:-20px}.inner{margin-bottom:16vh}}
@keyframes ea-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@media (prefers-reduced-motion:no-preference){.egg{animation:ea-bob 3.4s ease-in-out infinite}.egg.b{animation-delay:-.6s}.egg.c{animation-delay:-1.2s}.egg.d{animation-delay:-1.8s}.egg.e{animation-delay:-2.4s}}
</style>
<section class="s"><div class="inner"><img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster"><h1>Happy Easter</h1><p>Wishing you a bright and joyful spring.</p></div>
<div class="eggs"><div class="egg a"></div><div class="egg b"></div><div class="egg c"></div><div class="egg d"></div><div class="egg e"></div></div></section>
</body></html>
