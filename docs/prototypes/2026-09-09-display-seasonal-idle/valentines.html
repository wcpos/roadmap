<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valentine&#x27;s Day — Love letter</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:#f6d5dc;display:flex;align-items:center;justify-content:center;color:#5a1f2e}
.hearts{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle at 30% 30%,#e8879a 0 8px,transparent 9px),radial-gradient(circle at 70% 30%,#e8879a 0 8px,transparent 9px);background-size:120px 120px;background-position:0 0,0 0}
.env{position:relative;width:min(720px,84vw);background:#fffaf7;border-radius:16px;box-shadow:0 30px 60px rgba(90,31,46,.18);padding:56px 56px 48px;text-align:center;overflow:hidden}
.env:before{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(135deg,#fde6ea 50%,transparent 50%) left/50% 100% no-repeat,linear-gradient(-135deg,#fde6ea 50%,transparent 50%) right/50% 100% no-repeat}
.seal{position:absolute;left:50%;top:88px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e0485f,#a3122f);box-shadow:0 6px 14px rgba(163,18,47,.4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
.brand{height:84px;width:auto;object-fit:contain;display:block;margin:118px auto 14px;position:relative}
h1{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(42px,6vw,80px);margin:0 0 12px;color:#a3122f;line-height:1}
p{margin:0;font-size:clamp(17px,2vw,24px);color:#7a3546;text-wrap:balance}
@media (max-width:600px){.env{padding:48px 24px 36px}.brand{margin-top:56px}}
@keyframes val-beat{0%,100%{transform:translateX(-50%) scale(1)}12%{transform:translateX(-50%) scale(1.12)}24%{transform:translateX(-50%) scale(1)}}@keyframes val-drift{from{background-position:0 0,0 0}to{background-position:0 120px,0 120px}}@media (prefers-reduced-motion:no-preference){.seal{animation:val-beat 2.6s ease-in-out infinite}.hearts{animation:val-drift 18s linear infinite}}
</style>
<section class="s"><div class="hearts"></div>
<div class="env"><div class="seal">&#9829;</div><img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster"><h1>Happy Valentine's Day</h1><p>Treat someone you love today.</p></div></section>
</body></html>
