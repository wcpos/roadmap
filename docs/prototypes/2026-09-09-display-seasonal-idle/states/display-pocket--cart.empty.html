<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>display-pocket — cart.empty</title></head><body><!--
Pocket — WCPOS Pro customer display template for small screens.
A docked header carries the running total; items list newest-first beneath
it; payment states take the whole screen. Designed for a phone in portrait,
survives landscape. Rows carry data-wcpos-line-key for the host's
.wcpos-line-new cue.
-->
<style>
:root{--pk-ink:#0f172a;--pk-muted:#64748b;--pk-line:#e2e8f0;--pk-bg:#fff;--pk-accent:#0f766e;--pk-ok:#15803d;--pk-bad:#b91c1c}
html,body{margin:0;min-height:100%;background:var(--pk-bg)}
.wcpos-pocket,.wcpos-pocket *{box-sizing:border-box}
.wcpos-pocket{display:flex;flex-direction:column;height:100vh;height:100dvh;color:var(--pk-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wcpos-pocket__head{padding:env(safe-area-inset-top,0) 20px 14px;padding-top:max(18px,env(safe-area-inset-top));background:var(--pk-ink);color:#fff;flex:none}
.wcpos-pocket__store{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.wcpos-pocket__total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.wcpos-pocket__total-label{font-size:15px;font-weight:600;opacity:.8}
.wcpos-pocket__total-amount{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.wcpos-pocket__greeting{margin-top:6px;font-size:16px;color:#5eead4;font-weight:600}
.wcpos-pocket__list{flex:1;display:flex;flex-direction:column-reverse;justify-content:flex-end;overflow:auto;padding:6px 20px 20px}
.wcpos-pocket__row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--pk-line);font-size:17px}
.wcpos-pocket__row.wcpos-line-new{background:#ecfeff;margin:0 -20px;padding:12px 20px;box-shadow:inset 4px 0 0 var(--pk-accent);animation:pocket-in .35s ease-out}
.wcpos-pocket__name{font-weight:600;min-width:0}
.wcpos-pocket__qty{color:var(--pk-muted);font-weight:500;margin-right:6px}
.wcpos-pocket__meta{display:block;color:var(--pk-muted);font-size:13px;font-weight:400;margin-top:2px}
.wcpos-pocket__price{font-weight:600;font-variant-numeric:tabular-nums}
.wcpos-pocket__empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--pk-muted);font-size:17px;text-align:center;padding:20px}
.wcpos-pocket__foot{flex:none;padding:10px 20px 16px;border-top:1px solid var(--pk-line);font-size:14px;color:var(--pk-muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.wcpos-pocket__foot b{color:var(--pk-ok);font-weight:600}
/* Payment: full screen. */
.wcpos-pocket--pay{align-items:center;justify-content:center;text-align:center;padding:32px 24px;background:var(--pk-accent);color:#fff}
.wcpos-pocket--ok{background:var(--pk-ok)}
.wcpos-pocket--bad{background:var(--pk-bad)}
.wcpos-pocket__icon{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.18);font-size:52px;margin-bottom:22px}
.wcpos-pocket__spinner{border:7px solid rgba(255,255,255,.35);border-top-color:#fff;background:transparent;animation:pocket-spin 1.1s linear infinite}
.wcpos-pocket__title{font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.wcpos-pocket__amount{margin-top:8px;font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wcpos-pocket__msg{margin-top:12px;font-size:18px;line-height:1.4;opacity:.92}
.wcpos-pocket__split{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.3);width:100%;max-width:320px;font-size:15px;opacity:.9;display:flex;justify-content:space-between}
.wcpos-pocket--idle{align-items:center;justify-content:center;gap:18px;text-align:center;background:var(--pk-ink);color:#fff;padding:24px}
.wcpos-pocket__logo{display:block;max-width:70vw;max-height:30vh;object-fit:contain}
.wcpos-pocket__brand{font-size:36px;font-weight:800;letter-spacing:-.02em}
.wcpos-pocket__welcome{color:#94a3b8;font-size:18px}
@keyframes pocket-spin{to{transform:rotate(360deg)}}
@keyframes pocket-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wcpos-pocket__spinner,.wcpos-pocket__row.wcpos-line-new{animation:none}}
/* Landscape phone: header goes left, list right. */
@media (orientation:landscape) and (max-height:500px){
  .wcpos-pocket:not(.wcpos-pocket--pay):not(.wcpos-pocket--idle){flex-direction:row}
  .wcpos-pocket__head{width:44%;display:flex;flex-direction:column;justify-content:center;padding:20px}
  .wcpos-pocket__total{flex-direction:column;align-items:flex-start;gap:2px}
  .wcpos-pocket__foot{display:none}
}
</style>

<section class="wcpos-pocket wcpos-pocket--idle" data-wcpos-state="idle">
  <img class="wcpos-pocket__logo" src="https:&#x2F;&#x2F;dev-next.wcpos.com&#x2F;wp-content&#x2F;plugins&#x2F;woocommerce-pos-pro&#x2F;vendor&#x2F;wcpos&#x2F;woocommerce-pos&#x2F;assets&#x2F;img&#x2F;template-gallery&#x2F;preview-assets&#x2F;coffee-monster.png" alt="Coffee Monster">
  
  <div class="wcpos-pocket__welcome">Welcome</div>
</section>

<section class="wcpos-pocket" data-wcpos-state="cart">
  <header class="wcpos-pocket__head">
    <div class="wcpos-pocket__store">Coffee Monster</div>
    <div class="wcpos-pocket__total"><span class="wcpos-pocket__total-label">Total</span><span class="wcpos-pocket__total-amount">$0.00</span></div>
    <div class="wcpos-pocket__greeting">Hi Max!</div>
  </header>
  <div class="wcpos-pocket__empty">Your items will appear here</div>
</section>

<section class="wcpos-pocket wcpos-pocket--pay" data-wcpos-state="payment.started">
  <div class="wcpos-pocket__icon wcpos-pocket__spinner" aria-hidden="true"></div>
  <div class="wcpos-pocket__title">Please present your card</div>
  <div class="wcpos-pocket__amount">$0.00</div>
  
</section>

<section class="wcpos-pocket wcpos-pocket--pay wcpos-pocket--ok" data-wcpos-state="payment.approved">
  <div class="wcpos-pocket__icon" aria-hidden="true">&#10003;</div>
  <div class="wcpos-pocket__title">Approved</div>
  <div class="wcpos-pocket__amount">$0.00</div>
  
</section>

<section class="wcpos-pocket wcpos-pocket--pay wcpos-pocket--bad" data-wcpos-state="payment.declined">
  <div class="wcpos-pocket__icon" aria-hidden="true">&times;</div>
  <div class="wcpos-pocket__title">Declined</div>
  <div class="wcpos-pocket__amount">$0.00</div>
  
  <div class="wcpos-pocket__msg">Please try another card or ask staff</div>
</section>

<section class="wcpos-pocket wcpos-pocket--pay wcpos-pocket--ok" data-wcpos-state="payment.complete">
  <div class="wcpos-pocket__icon" aria-hidden="true">&#10003;</div>
  <div class="wcpos-pocket__title">Paid in full</div>
  <div class="wcpos-pocket__amount">$0.00</div>
  
  <div class="wcpos-pocket__msg">Thank you, Max</div>
</section>
<script>for (const s of document.querySelectorAll('section[data-wcpos-state]')) if (s.dataset.wcposState !== "cart") s.remove();</script></body></html>
