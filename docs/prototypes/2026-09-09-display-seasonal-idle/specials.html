<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Specials board — today's featured items</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:#111827;color:#f8fafc;display:grid;grid-template-columns:1fr 1.1fr;align-items:stretch}
.side{background:#1f2937;padding:6vh 5vw;display:flex;flex-direction:column;justify-content:center;gap:18px;border-right:1px solid rgba(255,255,255,.08)}
.brand{height:84px;width:auto;object-fit:contain;background:#fff;border-radius:12px;padding:8px 14px;align-self:flex-start}
.kicker{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#fbbf24}
h1{margin:0;font-size:clamp(40px,5.6vw,72px);font-weight:800;letter-spacing:-.02em;line-height:1}
.side p{margin:0;font-size:clamp(16px,1.8vw,21px);color:#cbd5e1;max-width:28ch}
.board{padding:6vh 5vw;display:flex;flex-direction:column;justify-content:center;gap:0}
.item{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px dashed rgba(255,255,255,.15)}
.item:last-child{border-bottom:0}
.item b{display:block;font-size:clamp(22px,2.6vw,32px);font-weight:700}
.item small{display:block;margin-top:4px;font-size:clamp(14px,1.5vw,18px);color:#94a3b8}
.item em{font-style:normal;font-size:clamp(22px,2.6vw,32px);font-weight:800;color:#fbbf24;font-variant-numeric:tabular-nums}
.item.hot b:after{content:"Popular";margin-left:12px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#111827;background:#fbbf24;padding:3px 8px;border-radius:999px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.item{animation:sp-in .5s ease-out both}.item:nth-child(2){animation-delay:.08s}.item:nth-child(3){animation-delay:.16s}.item:nth-child(4){animation-delay:.24s}}
@keyframes sp-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (max-width:700px){.s{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{border-right:0;border-bottom:1px solid rgba(255,255,255,.08);padding:4vh 6vw}.board{padding:2vh 6vw}.item{padding:14px 0}}
</style>

</div></section>
</body></html>
