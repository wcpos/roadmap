<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sale — Ticket</title></head><body>
<style>
html,body{margin:0;height:100%}
.s{position:relative;height:100vh;overflow:hidden;background:#ffd400;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;color:#111}
.stripe{position:absolute;left:0;right:0;height:26px;background:repeating-linear-gradient(135deg,#111 0 24px,#ffd400 24px 48px)}
.stripe.t{top:0} .stripe.b{bottom:0}
.ticket{position:relative;background:#111;color:#fff;border-radius:22px;padding:42px 60px 40px;width:min(760px,86vw);text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.25)}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:44px;height:44px;border-radius:50%;background:#ffd400;transform:translateY(-50%)}
.ticket:before{left:-22px} .ticket:after{right:-22px}
.brand{height:78px;width:auto;object-fit:contain;background:#fff;border-radius:12px;padding:8px 14px;display:block;margin:0 auto 14px}
.tag{display:inline-block;transform:rotate(-4deg);background:#e11d2f;color:#fff;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px;padding:8px 16px;border-radius:6px;margin-bottom:8px}
h1{margin:0;font-size:clamp(96px,17vw,220px);font-weight:900;letter-spacing:-.06em;line-height:.85;color:#ffd400}
.off{margin:12px 0 10px;font-size:clamp(22px,3vw,38px);font-weight:800;letter-spacing:.02em}
p{margin:0;font-size:clamp(16px,1.9vw,22px);opacity:.85;text-wrap:balance}
@media (max-width:600px){.ticket{padding:30px 22px}}
@keyframes sale-wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-1deg)}}@keyframes sale-stripe{from{background-position:0 0}to{background-position:68px 0}}@media (prefers-reduced-motion:no-preference){.tag{animation:sale-wobble 2.4s ease-in-out infinite}.stripe{animation:sale-stripe 3s linear infinite}}
</style>
<section class="s">
  <div class="stripe t"></div>
  <div class="ticket">
    <img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster">
    <div class="tag">This week only</div>
    <h1>SALE</h1>
    <div class="off">Up to 50% off selected items</div>
    <p>Ask us in store for details.</p>
  </div>
  <div class="stripe b"></div>
</section>
</body></html>
