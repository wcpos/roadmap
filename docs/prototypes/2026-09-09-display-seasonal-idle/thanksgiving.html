<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanksgiving — Harvest</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:radial-gradient(circle at 50% 40%,#f3d9a4,#e0b56b 70%);display:flex;align-items:center;justify-content:center;color:#4a2a12}
.wreath{position:absolute;width:min(96vh,760px);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%)}
.wreath i{position:absolute;left:50%;top:50%;width:11%;height:24%;margin:-12% 0 0 -5.5%;border-radius:0 50% 0 50%;background:var(--c);transform:rotate(var(--r)) translateY(-200%) rotate(45deg);opacity:.95}
.inner{position:relative;text-align:center;max-width:min(480px,62vw)}
.brand{height:76px;width:auto;object-fit:contain;display:block;margin:0 auto 10px}
h1{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;font-weight:700;font-size:clamp(34px,4.8vw,60px);margin:0 0 8px;color:#7a2e12;line-height:1.05;text-wrap:balance}
p{margin:0;font-size:clamp(15px,1.8vw,21px);color:#6b4a2b;text-wrap:balance}
@media (max-width:600px){.wreath{width:125vw}}
@keyframes tg-turn{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}@media (prefers-reduced-motion:no-preference){.wreath{animation:tg-turn 240s linear infinite}}
</style>
<section class="s"><div class="wreath"><i style="--r:0deg;--c:#b5452b"></i><i style="--r:24deg;--c:#d97b2b"></i><i style="--r:48deg;--c:#e6a832"></i><i style="--r:72deg;--c:#8c3d1c"></i><i style="--r:96deg;--c:#c96a2a"></i><i style="--r:120deg;--c:#b5452b"></i><i style="--r:144deg;--c:#d97b2b"></i><i style="--r:168deg;--c:#e6a832"></i><i style="--r:192deg;--c:#8c3d1c"></i><i style="--r:216deg;--c:#c96a2a"></i><i style="--r:240deg;--c:#b5452b"></i><i style="--r:264deg;--c:#d97b2b"></i><i style="--r:288deg;--c:#e6a832"></i><i style="--r:312deg;--c:#8c3d1c"></i><i style="--r:336deg;--c:#c96a2a"></i></div>
<div class="inner"><img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster"><h1>Happy Thanksgiving</h1><p>Thank you for shopping local this year.</p></div></section>
</body></html>
