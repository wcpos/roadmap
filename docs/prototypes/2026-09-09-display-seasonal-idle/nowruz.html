<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowruz — Spring equinox</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:linear-gradient(180deg,#e9f5df 0%,#cfeac2 100%);display:flex;align-items:center;justify-content:center;color:#1f4d2a}
.inner{text-align:center;margin-bottom:10vh;position:relative;z-index:2}
.brand{height:84px;width:auto;object-fit:contain;display:block;margin:0 auto 12px}
h1{margin:0 0 8px;font-size:clamp(44px,6.6vw,90px);font-weight:800;letter-spacing:-.02em;color:#1f6b3a;line-height:1}
p{margin:0;font-size:clamp(17px,2vw,24px);color:#3d6b48}
.tulip{position:absolute;bottom:0;width:60px;height:34vh}
.tulip i{position:absolute;left:50%;bottom:0;width:6px;height:70%;margin-left:-3px;background:#3d8a4f;border-radius:3px}
.tulip b{position:absolute;left:50%;bottom:64%;width:52px;height:70px;margin-left:-26px;background:var(--c);border-radius:50% 50% 45% 45%/70% 70% 30% 30%;clip-path:polygon(0 100%,0 30%,20% 0,50% 25%,80% 0,100% 30%,100% 100%)}
@media (max-width:600px){.tulip{height:22vh;width:40px}.tulip b{width:34px;height:46px;margin-left:-17px}}
@keyframes nr-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@media (prefers-reduced-motion:no-preference){.tulip{transform-origin:50% 100%;animation:nr-sway 4.5s ease-in-out infinite}.tulip:nth-child(2n){animation-delay:-1.5s}.tulip:nth-child(3n){animation-delay:-2.7s}}
</style>
<section class="s"><div class="inner"><img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster"><h1>Nowruz Mubarak</h1><p>A happy new year and a bright spring to you.</p></div>

</body></html>
