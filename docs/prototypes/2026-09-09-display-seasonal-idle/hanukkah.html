<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanukkah — Menorah</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:linear-gradient(180deg,#0b1f4b,#122a63 70%,#0b1f4b);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#eaf0ff;gap:26px}
.menorah{display:flex;align-items:flex-end;gap:22px;height:180px;border-bottom:8px solid #cfd8ea;padding:0 30px 0}
.c{position:relative;width:16px;height:var(--h);background:var(--c);border-radius:4px 4px 0 0}
.c span{position:absolute;left:50%;top:-30px;width:16px;height:28px;margin-left:-8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff8d6,#ffc23d 50%,#ff8a00 85%,transparent);box-shadow:0 0 22px 6px rgba(255,194,61,.45)}
.brand{height:80px;width:auto;object-fit:contain;background:#fff;border-radius:12px;padding:8px 14px}
h1{margin:0;font-size:clamp(44px,6.5vw,88px);font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1}
p{margin:0;font-size:clamp(17px,2vw,24px);color:#c9d6f5;text-align:center;text-wrap:balance}
@media (max-width:600px){.menorah{gap:10px;height:130px;padding:0 10px}.c{width:10px}}
@keyframes hk-flame{0%,100%{transform:scale(1)}40%{transform:scale(1.1,1.15)}70%{transform:scale(.95,.9)}}@media (prefers-reduced-motion:no-preference){.c span{transform-origin:50% 100%;animation:hk-flame 1.4s ease-in-out infinite}.c:nth-child(2n) span{animation-delay:-.4s}.c:nth-child(3n) span{animation-delay:-.9s}}
</style>
<section class="s"><img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster">
<div class="menorah"><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div><div class="c" style="--h:130px;--c:#ffd166"><span></span></div><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div><div class="c" style="--h:90px;--c:#cfd8ea"><span></span></div></div>
<h1>Happy Hanukkah</h1><p>Wishing you light and warmth this festival.</p></section>
</body></html>
