<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Father&#x27;s Day — Workshop</title></head><body>
<style>html,body{margin:0;height:100%}.s{position:relative;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.s{background:#2b3440;display:flex;align-items:center;justify-content:center;color:#f3ede4}
.plaid{position:absolute;left:0;right:0;height:22vh;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 18px,transparent 18px 46px),repeating-linear-gradient(0deg,rgba(211,84,58,.35) 0 18px,transparent 18px 46px),#1f2731}
.plaid.t{top:0} .plaid.b{bottom:0}
.card{position:relative;background:#c89b6b;color:#2b1d12;border-radius:10px;padding:40px 56px 44px;width:min(680px,84vw);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);border:6px solid #a77b4c}
.brand{height:80px;width:auto;object-fit:contain;display:block;margin:0 auto 12px;background:#fff;border-radius:10px;padding:8px 14px}
h1{margin:0 0 8px;font-size:clamp(44px,7vw,96px);font-weight:900;letter-spacing:-.02em;line-height:.95;text-transform:uppercase}
p{margin:0;font-size:clamp(16px,2vw,24px);font-weight:600;color:#4a3220}
@media (max-width:600px){.card{padding:32px 22px}}
@keyframes fd-slide{from{background-position:0 0,0 0}to{background-position:92px 0,0 0}}@media (prefers-reduced-motion:no-preference){.plaid{animation:fd-slide 20s linear infinite}}
</style>
<section class="s"><div class="plaid t"></div><div class="plaid b"></div>
<div class="card"><img class="brand" src="https://dev-next.wcpos.com/wp-content/plugins/woocommerce-pos-pro/vendor/wcpos/woocommerce-pos/assets/img/template-gallery/preview-assets/coffee-monster.png" alt="Coffee Monster"><h1>Happy Father's Day</h1><p>Something for the old man? Ask us.</p></div></section>
</body></html>
