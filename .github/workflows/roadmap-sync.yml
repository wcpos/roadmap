name: Roadmap sync
on:
  workflow_dispatch:
    inputs:
      bulk:
        description: Allow more than BULK_CAP projection writes (shows them all in the dry-run digest)
        type: boolean
        default: false
      dry_run:
        description: Ignored while the DRY_RUN constant is true; this job has no apply path
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - run: npm ci
        working-directory: sync
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.PROJECT_BOT_APP_ID }}
          private-key: ${{ secrets.PROJECT_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: woocommerce-pos,woocommerce-pos-pro,monorepo,electron,roadmap
      - name: Sync (dry run)
        working-directory: sync
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BULK: ${{ inputs.bulk }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: node src/cli.ts
